# Datenverantwortung: welchem Modul gehört welches Speicher-Dokument (app/api/storage.php)?
#
# Regel GR-101: Ein Modul schreibt nur eigene Dokumente. Fremde Dokumente schreibt es nur, wenn es unter
# „schreiber“ eingetragen ist – und dann über die Funktionen des Eigentümers. Lesen fremder Dokumente nur, wenn
# es unter „leser“ oder „schreiber“ steht. Der Plattformkern darf für Betrieb, Sicherung und Diagnose alles lesen.
# werkzeuge/regeln.py prüft das anhand der Aufrufe store_read/store_write/store_delete/with_lock im Code.
#
# Einträge unter „schreiber“ mit Vermerk „Altbestand“ sind heutige Querzugriffe, die beim Umzug in Module
# (Phase 8/9) durch Schnittstellen ersetzt werden. Neue Querzugriffe nur nach Abstimmung (koordinationspflichtig).
#
# schutz:  oeffentlich – darf (gefiltert) an nicht angemeldete Besucher gehen
#          intern      – nur angemeldete Mitarbeiter
#          vertraulich – Kunden-/Geschäftsdaten (Preise, Einkaufspreise, Kontaktdaten); nur mit passendem Recht
#          geheim      – Passwort-Hashes, Schlüssel, Sitzungen; nie in Antworten oder Protokollen
# historie: wie frühere Stände gegen spätere Stammdatenänderungen geschützt sind (Master-Auftrag Abschnitt 10)
# dynamisch = true: Name wird im Code berechnet (Konstante/Variable) und ist für die Prüfung nicht sichtbar.
# bereich: wo das Dokument liegt, sobald die Daten getrennt sind (ADR-007 Stufe 2, deploy/daten-trennen.sh):
#          kundenseite – braucht die Kundenseite (angebot-stafl.de): bleibt im gemeinsamen Ordner daten/
#          intern      – nur Mitarbeiterseite und Postausgang: Ordner daten-intern/, den die Kundenseite nicht sieht
#          veroeffentlicht – schreibt nur die Mitarbeiterseite (innen); die Kundenseite liest eine Kopie im gemeinsamen Ordner, die sie
#                      nicht schreiben kann – verändert sie die Kopie doch, stellt der Postausgang sie wieder her und meldet es (Stufe 2c)
#          je_seite    – jede Seite schreibt ihr eigenes Dokument gleichen Namens (Kundenseite außen, Mitarbeiterseite innen), z. B.
#                      Zähler und Live-Verkehr; die Mitarbeiterseite liest beide zusammen (Stufe 2e)
#          Neue Dokumente sind intern, außer die Kundenseite liest oder schreibt sie nachweislich (Testgruppe datentrennung).
#          Erzeugt app/api/lib/datenbereiche-liste.php (`python3 werkzeuge/regeln.py erzeugen`).
# trennstufe = n: internes Dokument, das erst mit Trennstufe n umzieht (bis dahin im gemeinsamen Ordner, damit ein Release
#          allein nichts ändert); umgestellt wird mit `deploy/daten-trennen.sh trennen` (Stufe 1 = Stufe 2a, Stufe 2 = Stufe 2b).
# felder_kundenseite (nur kunden): ab Trennstufe 2 bleiben nur diese Felder im gemeinsamen Ordner, alle übrigen (Anschrift,
#          E-Mail, Telefon, Notiz, Vertreter, Daten der Warenwirtschaft …) stehen im internen Dokument kundenstamm.

