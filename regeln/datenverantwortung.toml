# Datenverantwortung: welchem Modul gehört welches Speicher-Dokument (app/api/storage.php)?
#
# Regel GR-101: Ein Modul schreibt nur eigene Dokumente. Fremde Dokumente schreibt es nur, wenn es unter
# „schreiber“ eingetragen ist – und dann über die Funktionen des Eigentümers. Lesen fremder Dokumente nur, wenn
# es unter „leser“ oder „schreiber“ steht. Der Plattformkern darf für Betrieb, Sicherung und Diagnose alles lesen.
# werkzeuge/regeln.py prüft das anhand der Aufrufe store_read/store_write/store_delete/with_lock im Code.
#
# Einträge unter „schreiber“ mit Vermerk „Altbestand“ sind heutige Querzugriffe, die beim Umzug in Module
# (Phase 8/9) durch Schnittstellen ersetzt werden. Neue Querzugriffe nur nach Abstimmung (koordinationspflichtig).
#
# schutz:  oeffentlich – darf (gefiltert) an nicht angemeldete Besucher gehen
#          intern      – nur angemeldete Mitarbeiter
#          vertraulich – Kunden-/Geschäftsdaten (Preise, Einkaufspreise, Kontaktdaten); nur mit passendem Recht
#          geheim      – Passwort-Hashes, Schlüssel, Sitzungen; nie in Antworten oder Protokollen
# historie: wie frühere Stände gegen spätere Stammdatenänderungen geschützt sind (Master-Auftrag Abschnitt 10)
# dynamisch = true: Name wird im Code berechnet (Konstante/Variable) und ist für die Prüfung nicht sichtbar.

schema = 1

# ───────────── Angebot ─────────────

[[dokument]]
name = "angebot"
eigentuemer = "angebot"
leser = ["bestand", "plattform"]
schutz = "oeffentlich"
beschreibung = "Veröffentlichtes Wochenangebot; öffentlich nur gefiltert über offer_resolve (GR-001, GR-002)"
historie = "Jede Veröffentlichung legt eine Version an (versionen/*) und den Preisverlauf (historie/*)"

[[dokument]]
