# Aktionen des Moduls „einkauf“: Fehlmengen und Meldung an den Einkauf.
# Erklärung der Felder: regeln/aktionen/LIESMICH.md · nach Änderungen: python3 werkzeuge/regeln.py erzeugen

schema = 1
modul = "einkauf"

[aktion.einkauf]
oberflaeche = "angebot.eingabe"
zugang_gemeinsam = true   # Ansicht „Bedarf melden“ liegt noch im Angebotsbereich (eigene Oberfläche geplant)

[aktion.einkauf_melden]
oberflaeche = "angebot.eingabe"
schreibend = true
zugang_gemeinsam = true   # Ansicht „Bedarf melden“ liegt noch im Angebotsbereich (eigene Oberfläche geplant)
