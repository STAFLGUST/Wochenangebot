# Erklärung der Felder: regeln/aktionen/LIESMICH.md · nach Änderungen: python3 werkzeuge/regeln.py erzeugen
# Oberfläche crm.intern (produktiv seit der Freigabe des Inhabers 23.10.2026, crm.dashboard-stafl.de). Auf Keycloak-Hosts
# antworten die Aktionen nur auf diesem Host (Aktion ↔ Host, GR-109, lib/herkunft.php), auf anderen mit 404.

