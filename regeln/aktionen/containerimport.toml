# Aktionen des Moduls „containerimport“: Container (im Code „sendung“) mit ihren Farmern (im Code „betrieb“); Reiter EUDR – Risikoprofil, GeoJSON für TRACES.
# Die Namen der Aktionen bleiben, wie sie sind (bestehende Aufrufe, GR-006).
# Erklärung der Felder: regeln/aktionen/LIESMICH.md · nach Änderungen: python3 werkzeuge/regeln.py erzeugen
# Alle Aktionen gibt es nur auf dem Host des Moduls (GR-109); der Modulzugang containerimport.zugang gilt für jede Aktion,
# Inhalte verlangen containerimport.eudr_sehen, alles Speichernde containerimport.eudr_bearbeiten (GR-103).

schema = 1
modul = "containerimport"

# Stand: Farmer und Container mit Befunden und Risikoprofil, Länder, Portale, Lieferanten der Stammdaten, eigene Rechte
[aktion.containerimport_start]
oberflaeche = "containerimport.intern"

# Dateien prüfen, ohne zu speichern: Lieferanten-GeoJSON, gelesene Berichte, eingefügte Koordinaten (POST wegen Inhalt)
[aktion.containerimport_eudr_pruefen]
oberflaeche = "containerimport.intern"
schreibend = true

# Farmer anlegen oder ändern, optional einem Container zuordnen
[aktion.containerimport_eudr_betriebe_save]
oberflaeche = "containerimport.intern"
schreibend = true

# Original einer eingelesenen Datei in Teilen hochladen und im Eingang des QM-Systems ablegen
[aktion.containerimport_eudr_original]
oberflaeche = "containerimport.intern"
schreibend = true

# Eigene Gegenprüfung der Entwaldung an einem Betrieb ergänzen
[aktion.containerimport_eudr_gegenpruefung]
oberflaeche = "containerimport.intern"
schreibend = true

# Whisp (FAO) für einen Betrieb abfragen: starten oder Stand holen; speichert nichts (POST wegen CSRF, der Umriss geht an Whisp)
[aktion.containerimport_eudr_whisp]
oberflaeche = "containerimport.intern"
schreibend = true

# Container anlegen oder ändern (Lieferant aus den Stammdaten, Partie-, Akten- und Containernummer, Stand)
[aktion.containerimport_eudr_sendung_save]
oberflaeche = "containerimport.intern"
schreibend = true

# Schlachthof anlegen oder ändern (Stammdaten unter dem Lieferanten)
[aktion.containerimport_schlachthof_save]
oberflaeche = "containerimport.intern"
schreibend = true

# Risikobewertung eines Containers abschließen oder wieder öffnen
[aktion.containerimport_eudr_sendung_abschluss]
oberflaeche = "containerimport.intern"
schreibend = true

# GeoJSON-Datei für das EU-Informationssystem (Container oder einzelner Farmer)
[aktion.containerimport_eudr_export]
oberflaeche = "containerimport.intern"
