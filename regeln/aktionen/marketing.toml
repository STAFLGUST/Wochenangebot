[aktion.marketing_beitrag_loeschen]
oberflaeche = "marketing.intern"
schreibend = true

[aktion.marketing_kampagne_save]
oberflaeche = "marketing.intern"
schreibend = true

[aktion.marketing_einstellungen_save]
