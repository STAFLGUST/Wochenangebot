# Aktionen des Moduls „plattform“: Anmeldung, Zwei-Faktor, Passkeys, Nutzer und Rechte, Sicherheit, Schutzzentrale, E-Mail-Postfach, Benachrichtigungen, Wartungsmodus, Dateiprüfung.
# Sicherheit, Schutzzentrale und Dateiprüfung liegen seit 26.10.2026 auf der Oberfläche des Moduls Sicherheit (sicherheit.intern,
# nur auf sicherheit.dashboard-stafl.de, GR-109); der Code bleibt im Plattformkern (aktionen/verwaltung.php, schutz.php, integritaet.php).
# Erklärung der Felder: regeln/aktionen/LIESMICH.md · nach Änderungen: python3 werkzeuge/regeln.py erzeugen

