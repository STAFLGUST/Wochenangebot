# Aktionen des Moduls „qs“ (QM-System nach IFS Wholesale): gelenkte Dokumente mit Versionen und Freigabe nach dem
# 4-Augen-Prinzip, QM-Handbuch (Abschnitte je Kapitel), Prüfplan mit Nachweisen und Fälligkeiten, Korrekturmaßnahmen,
# Stammdaten (Kapitel, Personen mit Kürzel), CSV-Listen und Übernahme eines Datenpakets (bisherige Excel „QM-System“).
# Erklärung der Felder: regeln/aktionen/LIESMICH.md · nach Änderungen: python3 werkzeuge/regeln.py erzeugen

