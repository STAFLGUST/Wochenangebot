# Aktionen des Moduls „verwaltung“: Stammdaten (Artikel, Kunden, Gruppen, Vertreter, Versandarten, Lieferanten, Abteilungen), Kundenimport, Importzentrale, Auswertung.
# Erklärung der Felder: regeln/aktionen/LIESMICH.md · nach Änderungen: python3 werkzeuge/regeln.py erzeugen

schema = 1
modul = "verwaltung"

# Angebotskategorien (Stammdaten): Abschnitte des Angebots mit zugeordneten VK-Gruppen, ordnen den Aufbau aller Angebote
[aktion.angebotskategorien]
oberflaeche = "angebot.eingabe"
zugang_gemeinsam = true   # Aufbau des Angebots: der Angebotseditor liest die Kategorien

[aktion.angebotskategorien_save]
oberflaeche = "angebot.eingabe"
schreibend = true

# Abteilungen (Inhaber 10.11.2026): Nummer und Bezeichnung; die HR-Angaben der Mitarbeiter verweisen darauf
[aktion.abteilungen]
oberflaeche = "angebot.eingabe"

[aktion.abteilungen_save]
oberflaeche = "angebot.eingabe"
schreibend = true

[aktion.auswertung]
oberflaeche = "angebot.eingabe"

[aktion.kunde_delete]
oberflaeche = "angebot.eingabe"
schreibend = true

[aktion.kunde_save]
oberflaeche = "angebot.eingabe"
schreibend = true

[aktion.kunden]
oberflaeche = "angebot.eingabe"
zugang_gemeinsam = true   # Kundenliste für Kundenangebote, Einzel- und Sonderangebote im Angebotsbereich

[aktion.kunden_import]
oberflaeche = "angebot.eingabe"
schreibend = true

# Importzentrale (Verwaltung → Import). Heute im Eingabebereich; sobald die Oberfläche verwaltung.import
# (verwaltung.dashboard-stafl.de/import/) freigegeben ist, ziehen diese drei Aktionen dorthin um.
[aktion.import_arten]
oberflaeche = "angebot.eingabe"

[aktion.import_pruefen]
oberflaeche = "angebot.eingabe"
schreibend = true

[aktion.import_teil]
oberflaeche = "angebot.eingabe"
schreibend = true

[aktion.import_uebernehmen]
oberflaeche = "angebot.eingabe"
schreibend = true

[aktion.kundengruppen]
oberflaeche = "angebot.eingabe"
zugang_gemeinsam = true   # Kundengruppen für Sonder- und Kundenangebote im Angebotsbereich

[aktion.kundengruppen_save]
oberflaeche = "angebot.eingabe"
schreibend = true

[aktion.master]
oberflaeche = "angebot.eingabe"
zugang_gemeinsam = true   # Artikelstammdaten: der Angebotseditor vergleicht und übernimmt sie

[aktion.master_save]
oberflaeche = "angebot.eingabe"
schreibend = true
zugang_gemeinsam = true   # Artikelstammdaten aus dem Angebotseditor („als Stammdaten speichern“, Vereinheitlichung)

[aktion.ort_update]
oberflaeche = "angebot.eingabe"
schreibend = true

# Lieferanten (vollständiger Lieferanten-Export der Warenwirtschaft, Wunsch des Inhabers 06.11.2026) und Versandarten
[aktion.lieferanten]
oberflaeche = "angebot.eingabe"

[aktion.lieferanten_save]
oberflaeche = "angebot.eingabe"
schreibend = true

[aktion.versandarten]
oberflaeche = "angebot.eingabe"

[aktion.versandarten_save]
oberflaeche = "angebot.eingabe"
schreibend = true

[aktion.vertreter]
oberflaeche = "angebot.eingabe"

[aktion.vertreter_save]
oberflaeche = "angebot.eingabe"
schreibend = true

[aktion.vkgruppen]
oberflaeche = "angebot.eingabe"
zugang_gemeinsam = true   # VK-Gruppen für Artikelwahl und Stammdatenabgleich im Angebotsbereich

[aktion.vkgruppen_save]
oberflaeche = "angebot.eingabe"
schreibend = true
