[[modul]]
id = "sicherheit"
name = "Sicherheit"
beschreibung = "Lagebild, Notfallmodus, Firewall und Sperren, Anmeldung und Sitzungen, Dateiprüfung, Sicherheitsereignisse, Einstellungen, privilegierte Konten und System (Betrieb, Wartung, Module)"
icon = "shield-lock"
reihenfolge = 81
dashboard = true
dashboard_gruppe = "verwaltung"   # Dashboard: im Bereich „Verwaltung & Daten“ direkt rechts neben der Verwaltung
zugang_rollen = []   # Modulzugang standardmäßig nur Administratoren; anderen nur ausdrücklich (Rollen/Mitarbeiter)
agent = "sicherheit"
abhaengigkeiten = ["plattform"]
testgruppen = ["sicherheit_modul", "notfall", "sicherheit_bereitschaft"]
pfade = ["regeln/aktionen/sicherheit.toml", "app/api/aktionen/sicherheit.php", "app/module/sicherheit/**",
  "tests/e2e/test_sicherheit_modul.py", "tests/e2e/test_notfall.py", "tests/e2e/test_sicherheit_bereitschaft.py", "docs/plattform/modul-sicherheit.md"]
pfade_geplant = []
hinweise = [
  "Auftrag und Freigabe des Inhabers (26.10.2026): Sicherheit als eigenes Modul mit Notfallmodus; Konzept docs/plattform/modul-sicherheit.md.",
  "Das Modul ist die Oberfläche – die Dienste (Einstellungen, Firewall, Dateiprüfung, Sitzungen, Protokoll, Notfall lib/notfall.php) gehören zum Plattformkern (koordinationspflichtig).",
  "Rechte: sicherheit.sehen (Lagebild, Ereignisse lesen), sicherheit.notfall (Notfall auslösen) ohne Standardrollen; Einstellungen, Sperren, Sitzungen und das Beenden des Notfalls nur Administratoren.",
  "Notfallmodus nutzt die Wartungs-Entscheidungstabelle (alle sperrbaren internen Oberflächen in Wartung, Kunden-Wartung), keine eigene Sperrlogik. Server-Notfallwerkzeug: deploy/notfall-aus.sh.",
  "Bereitschaft (lib/bereitschaft.php, Plattformkern): Leitfaden (Administrator pflegt, im Notfall abhakbar mit sicherheit.notfall), Probealarm (sicherheit.notfall, ohne Wirkung), Wochenbericht (Empfänger der Sicherheitsereignisse, automatisch über die Statusabfrage), ungenutzte Zugänge deaktivieren (Administrator, Bestätigung user_save).",
  "Freigegeben (Inhaber 26.10.2026): sicherheit.dashboard-stafl.de mit eigenem Keycloak-Client „sicherheit“ (Stand 9); / und /admin/ führen zu /module/sicherheit/. Aktionen nur auf diesem Host (GR-109).",
  "Reiter System (Auftrag des Inhabers 27.10.2026, vorher Verwaltung → System): Betriebszustand, Diagnose, Wartungsmodus, Wartung einzelner Bereiche, Module und Freigaben – nur Administratoren. Die Dienste (lib/module.php, lib/diagnose.php, Wartung) bleiben im Plattformkern; die Aktionen liegen auf sicherheit.intern.",
]

  [[modul.oberflaeche]]
  id = "intern"
  name = "Sicherheit"
  art = "intern"
  adresse = "https://sicherheit.dashboard-stafl.de/module/sicherheit/"
  entwicklung = "fertig"
  freigabe = "produktiv"   # Freigabe des Inhabers 26.10.2026 (Keycloak-Client, Caddy, produktiv) mit dem Merge; DNS-Eintrag sicherheit besteht seit 26.10.2026
  sperrbar = false   # die Sicherheitszentrale darf nie in Wartung gehen (auch nicht im Notfallmodus); Reiter System: Schutz vor Aussperrung (werkzeuge/regeln.py)

