  "Vorlage: Vertriebs-CRM-Musterdatei (Oktober 2026) – Cockpit, Kunden, Karte, Wiedervorlagen, Pipeline, Auswertung. Echte Daten der Musterdatei gehören nicht ins Repository (GR-007).",
