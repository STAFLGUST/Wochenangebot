hinweise = [
  "Urlaubsverwaltung (Oktober 2026): Anträge der Mitarbeiter (hr.antrag), Genehmigung durch Mitarbeiter mit dem zuweisbaren Recht hr.genehmigen (seit 25.10.2026, nie den eigenen Antrag; vorher hr.verwalten), Krank/Gleittag/freie Tage nur durch die Personalstelle, Übertrag bis 31.03. (Verfallstag einstellbar in Verwaltung → Urlaub, hr-einstellungen.uebertragBis), Kalender für alle nur „abwesend“ – seit 11.11.2026 für Mitarbeiter nur die eigene Abteilung, Personalstelle und hr.uebersicht alle, Excel-Export für den Steuerberater, Übernahme der bisherigen Excel-Planung.",
  "Einträge ohne (gültigen) Mitarbeiter = ehemalige Mitarbeiter (Inhaber 26.10.2026): nicht im Urlaubsplan, Einträge bleiben; Zuordnung nur von Hand bzw. bei eindeutig gleichem Namen, keine neuen Mitarbeiter.",
  "Mitarbeiter der Urlaubsverwaltung (hr-personal) sind keine Zugänge: auch Kollegen ohne Mitarbeiterkonto (z. B. Lager) werden geführt; mit Konto verknüpft, können sie selbst beantragen.",
  "Urlaubsübersicht (26.10.2026): zuweisbares Recht hr.uebersicht (auch hr.verwalten) – alle Mitarbeiter im Urlaubsplan mit Summen je Jahr (Konto, Krank-, Gleittage als Anzahl), Aktion hr_uebersicht.",
  "Urlaubskalender (11.11.2026): zuweisbares, sensibles Recht hr.kalender – im Kalender (hr_monat, Sicht „urlaub“) genehmigter Urlaub und Gleittage der Kollegen der eigenen Abteilung als „U“/„U+“, sonst „abwesend“ (andere Abteilungen sichtbar, nur „abwesend“); keine Tage, Konten, Übersicht, Jahresplanung oder Export. Datenschutz: Krankheitstage ableitbar, nur einzeln vergeben.",
  "Personaldaten sind besonders schützenswert: Abwesenheitsgründe (z. B. Krankheit) nie für Kollegen sichtbar; Rechte hr.* serverseitig (GR-103).",
  "Anmeldung nur über die zentrale Anmeldung (Keycloak, GR-110) – das Modul legt keine Zugänge an; die Personalliste wird mit vorhandenen Mitarbeiterkonten verknüpft.",
