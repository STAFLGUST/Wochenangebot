  "Umsatzstatistik, Reiter Auswertung (01.11.2026): Umsatzdaten der Warenwirtschaft (Kundenumsatztabelle) über die Importzentrale, Importart „umsatzdaten“ in Teilen (module/controlling/import.php, umsatzdaten.php; Leser app/module/controlling/umsatz-import.js im Eingabebereich). Der Zeitraum der Datei ersetzt die gespeicherten Umsätze dieses Zeitraums. Auswertung umsatzauswertung.php: Zuordnung zu Vertreter, Kundengruppe, Artikelgruppe nach heutigen Stammdaten.",
