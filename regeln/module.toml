# Modulregister der STAFL-Plattform – einzige Quelle für Module, Oberflächen, Zuständigkeiten und Code-Pfade.
#
# Gelesen von: werkzeuge/regeln.py (CI-Prüfung und Änderungsfolgenanalyse), später vom Dashboard und der
# Modulverwaltung (erzeugte PHP-Liste, wie app/api/lib/integritaet-liste.php). Erklärung: docs/plattform/zielarchitektur.md
#
# Felder je Oberfläche:
#   entwicklung  Stand laut Code (ändert sich nur per Pull Request): geplant | in_entwicklung | in_pruefung | fertig
#   freigabe     Startwert der kontrollierten Freigabe (später zur Laufzeit in der Verwaltung, protokolliert):
#                keine | test (nur eingetragene Tester) | produktiv | deaktiviert
#                produktiv setzt entwicklung = fertig voraus; test setzt mindestens in_entwicklung voraus.
#   sperrbar     false = darf nie in Wartung/Deaktivierung gehen (Schutz vor Aussperrung der Administration)
#   adresse      heutige Adresse; ziel = beschlossene künftige Adresse (ADR-003), noch nicht in Betrieb
#   dns = false  Host hat noch keinen DNS-Eintrag und darf noch nicht im Caddyfile stehen (nur mit freigabe = "keine")
# Feld je Modul: zugang_rollen = Standardrollen mit Modulzugang „<modul>.zugang“ (ohne Angabe: viewer und editor; [] = keine)
#   Der Betriebszustand (normal/wartung) steht bewusst NICHT hier – er ist reine Laufzeit (regeln/wartung.toml).
#
# Pfade: „pfade“ müssen auf vorhandene Dateien passen, „pfade_geplant“ dürfen noch leer sein.
# Muster: * = beliebig innerhalb eines Ordners, ** = beliebig tief. Die genaueste (längste) Angabe gewinnt.

schema = 1

[dashboard]
# Verbindlicher Startumfang laut Auftrag; weitere Module kommen durch einen neuen [[modul]]-Eintrag hinzu.
pflichtmodule = ["angebot", "bestand", "crm", "rewe", "qs", "einkauf", "import", "verwaltung"]

# ───────────────────────────── Fachmodule (Kacheln im Dashboard) ─────────────────────────────

