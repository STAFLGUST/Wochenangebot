  "Cockpit je Verkäufer (Auftrag des Inhabers 01.11.2026): „Mein Cockpit“ zeigt die Kunden des Vertreters, der dem Mitarbeiter in der Verwaltung zugeordnet ist (Feld „vertreter“ am Nutzer; seine Kunden = Vertreter oder Vertreter 2), das Master-Cockpit (Recht crm.master, Administratoren immer) alle Vertreter mit Umschalter zur Verkäufer-Ansicht. Umsätze in € (crm.umsatz_euro) und Mengen in kg (crm.umsatz_kg) sind einzeln abschaltbar, Standard an. Zahlen und Signale (Bestellpause, kauft weniger, Artikel nicht mehr gekauft, neu) kommen über Funktionen des Controllings – DB und Spanne bleiben im Controlling.",
