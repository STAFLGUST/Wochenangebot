pfade_geplant = []
hinweise = [
  "Redaktionsplan (Auftrag des Inhabers 25.10.2026): Beiträge mit Marke, Kanälen, Format, Content-Säule, Kampagne, Verantwortlichen, Terminen (Dreh, Produktion bis, Veröffentlichung), Text, Hashtags, Skript, Checkliste, Material-Links und KI-Kennzeichen (Kennzeichnungspflicht Art. 50 KI-VO); Ablauf Idee → Planung → Produktion → Freigabe → geplant → veröffentlicht.",
  "Rechte marketing.sehen, marketing.bearbeiten, marketing.freigeben, marketing.verwalten ohne Standardrollen; nur marketing.freigeben setzt „geplant“, eine inhaltliche Änderung ohne dieses Recht nimmt die Freigabe zurück.",
