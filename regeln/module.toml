[[modul]]
id = "qs"
name = "Qualitätssicherung"
beschreibung = "QM-System nach IFS Wholesale: gelenkte Dokumente mit Freigabe, QM-Handbuch, Prüfplan mit Nachweisen und Versäumnissen, Maßnahmen"
icon = "shield-check"
reihenfolge = 50
dashboard = true
agent = "qs"
abhaengigkeiten = ["plattform", "hr"]
testgruppen = ["qs", "qs_ablage", "qs_eingang", "qs_import", "qs_vorlagen", "qs_bericht", "qs_verfahren", "ablage_grenzen", "qs_organigramm", "qs_kapitel15"]
pfade = ["regeln/aktionen/qs.toml", "app/api/aktionen/qs.php", "app/api/module/qs/**", "app/module/qs/**", "tests/e2e/test_qs*.py", "tests/fixtures/qs/**"]
pfade_geplant = []
hinweise = [
  "Auftrag des Inhabers (30.10.2026): Bau des QM-Systems begonnen; löst die Excel „QM-System“ ab (Blätter Inhaltsverzeichnis = Dokumentenlenkung, Managementsystem = QM-Handbuch, Prüfungen = Prüfplan) und die Maßnahmenpläne der Audits. Kachelname bleibt vorerst „Qualitätssicherung“. Dokumentenablage mit ZIP-Export (Abschnitt 2) und Dokumente aus Vorlagen (Abschnitt 3) gebaut.",
  "Vorlagen und Nummernstruktur (Abschnitt 3, Entscheidung Inhaber 30.10.2026): neue Dokumente aus Word-/Excel-Vorlagen (Art V); Platzhalter {{Nr}}, {{Titel}} … füllt das Erzeugen, {{Version}}, {{Datum}}, Kürzel die Freigabe (ausgefüllte Fassung neben der Rohfassung „roh“, Vorlagen selbst nie). Nummernstruktur <Kapitel>-<Art><Nr.> für A, F, L, E wird bei Neuanlage und Änderung von Nummer, Kapitel oder Art erzwungen (leer = nächste freie); bestehende Nummern aus der Excel bleiben, das Datenpaket prüft die Struktur nicht.",
  "Dokumentenablage (Abschnitt 2): Dateien je Version gelenkter Dokumente bzw. am Ordner/externen Dokument, gespeichert über die Dateiablage des Plattformkerns (lib/dateiablage.php, Bereich „qs“, data/dateien/qs/), Metadaten je Version in qs-dokumente, für Ordner, externe Dokumente und den Eingang in qs-ablage (Zahlen je Ziel in qs-ablage-zahlen; Regeln: docs/entwickler/05-daten.md, „QM-System: Dokumentenablage“). Ablegen im Entwurf mit „qs.bearbeiten“ (zählt als Bearbeiter, 4-Augen-Prinzip), in der Prüfung nur ansehen, an freigegebenen Versionen nachtragen/entfernen nur mit „qs.freigeben“ und Grund; außerhalb von Entwürfen wird nichts gelöscht, nur als entfernt vermerkt. ZIP „QM-System/<Kapitel>/<Dokument>/…“ entsteht nur beim Herunterladen. Ein Datenpaket ersetzt die Dokumente nicht mehr, sobald Dateien abgelegt sind.",
  "Dokumentenlenkung nach Handbuch 1.1 (2.0.9–2.0.17): Version zählt mit jeder Freigabe um 1 hoch, Datum = Freigabedatum; Erstellung/Überarbeitung und Prüfung durch zwei verschiedene Personen (4-Augen-Prinzip, serverseitig), Freigabe nur mit „qs.freigeben“. Ältere Versionen bleiben einsehbar (ersetzt), nichts wird gelöscht. Überprüfung fällig nach 36 Monaten (Einstellung) seit Freigabe bzw. „ohne Änderung überprüft“.",
  "Prüfplan (Entscheidung Inhaber 30.10.2026): täglich heißt täglich – tägliche, wöchentliche und monatliche Prüfungen folgen dem Kalender, jede Periode ohne Nachweis zählt als versäumt; Prüfungen sind Mitarbeitern zugewiesen, „qs.nachweis“ erlaubt nur Nachweise der eigenen Prüfungen. Nachweise werden nie geändert oder gelöscht, nur storniert (mit Grund).",
  "Personen (Kürzel, Name, Funktion) sind mit Mitarbeitern der Plattform verknüpft – gelesen nur über users_load des Plattformkerns (Kennung, Name, Zugang), keine Daten anderer Module. Feiertage über hr_feiertag (Modul HR). Kürzel in Versionen, Abschnitten und Maßnahmen sind Schnappschüsse (GR-106).",
  "Echte Daten nie ins Repository (GR-007): Übernahme der bisherigen Excel und der Maßnahmenpläne über ein Datenpaket (qs_import) in der Oberfläche.",
  "Externe QS-Nutzer (Kunden, Lieferanten, Prüfer) erhalten nie Zugang zur Mitarbeiterplattform (GR-104); das QS-Portal ist ein eigener späterer Abschnitt.",
  "Eingang und Ordner-Import (Auftrag des Inhabers 16.11.2026, ein PR #377): den ganzen QM-Ordner einmal wählen, das System legt jede Datei an der richtigen Stelle ab, die Ordnerstruktur bleibt erhalten, nur echte Reste in den Eingang; in gültige Versionen nur mit ausdrücklichem Häkchen (nicht umkehrbar). Eine zweite Firma (Matthies Fleischwaren) wird ein eigener Bereich (Kapitel mit bereich, Nummer 90 bis 99), ihre Nummern kommen nie mit Standard-Fleisch zusammen; stehen im gewählten Ordner Kapitelordner, muss der Nutzer ausdrücklich sagen, wohin er gehört. Der Eingang und Kapitel 1.5 „Mitarbeiter“ (personenbezogene Unterlagen, Entscheidung des Inhabers 16.11.2026) sind nur mit qs.bearbeiten sichtbar. Dateiarten und Höchstgröße liest das Modul vom Plattformkern (lib/dateiablage.php).",
  "Audit-Bericht (Wahl des Inhabers 30.10.2026): Auswertung eines Zeitraums (höchstens zwei Jahre) für das IFS-Audit – nur lesen, mit „QM-System ansehen“; Ansicht mit Drucken/PDF und Excel (module/qs/bericht.php, qs_bericht, qs_bericht_excel).",
  "Verfahrensdokumentation nach GoBD (Auftrag des Inhabers 12.11.2026: kompakt, auch in der Pflege, aber formal belastbar): Reiter „Verfahrensdoku“ mit eigenem Dokument qs-verfahren und drei eigenen, sensiblen Rechten (qs.verfahren_sehen / _bearbeiten / _freigeben). Fünf Teile, Mustergliederung mit 13 Abschnitten (nur Überschriften und Fragen – Inhalte schreibt das Unternehmen), Verweise auf QM-Dokumente statt doppeltem Text. Freigegebene Fassungen sind unveränderliche Schnappschüsse (GR-106) mit der Version jedes verknüpften QM-Dokuments und werden nie gelöscht; die Änderungsliste entsteht bei der Freigabe aus dem Vergleich mit der vorigen Fassung. Export für Prüfungen: PDF für einen Zeitraum (alle Fassungen, die dort galten), auf Wunsch ZIP mit den QM-Dokumenten der damaligen Version (module/qs/verfahren.php, verfahren-export.php).",
  "Organigramm (Entscheidung des Inhabers 16.11.2026 „Im QM-System zeichnen“): Struktur als optionales Feld „organigramm“ an einer Version eines gelenkten Dokuments in qs-dokumente (kein eigenes Speicher-Dokument, keine feste Nummer – ein Dokument wird zum Organigramm, sobald man im Entwurf „Organigramm im System zeichnen“ wählt). Stellen mit Personen aus den QM-Personen, Vertretung, Stabsstellen/Beauftragte seitlich an der Linie (ohne eigene Unterstellen). Ändern nur im Entwurf mit „qs.bearbeiten“ (zählt als Bearbeiter), PDF-Vorschau mit „qs.sehen“; ab dem Einreichen hält die Version die Namen fest (GR-106), die Freigabe übernimmt sie und legt die PDF-Fassung mit Lenkungsangaben als Datei der Version ab (module/qs/organigramm.php, app/module/qs/organigramm.js).",
  "Freigegeben mit dem Merge (Entscheidung des Inhabers 30.10.2026 „gleich produktiv“, ohne vorherige Testfreigabe): qs.dashboard-stafl.de mit eigenem Keycloak-Client „qs“ (Stand 13); / und /admin/ führen zu /module/qs/. Aktionen qs_* nur auf diesem Host (GR-109, lib/herkunft.php), dort außer ihnen nur Status und Abmelden. Modulzugang wie üblich für die Standardrollen; Inhalte erst mit „QM-System ansehen“ (ohne Standardrollen). Das QS-Portal (extern) bleibt geplant. DNS-Eintrag qs besteht seit 21.10.2026.",
]

