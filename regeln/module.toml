[[modul]]
id = "containerimport"
name = "Container-Import"
beschreibung = "Import von Ware aus Drittländern: Container (Lieferant, Partie-, Akten- und Containernummer, Stand) mit ihren Farmern; EUDR (Geolokalisierung, Risikoprofil, GeoJSON für TRACES); später Schlachthöfe, Tracking, Verzollung, Dokumente"
icon = "container"
reihenfolge = 65
dashboard = true
agent = "containerimport"
abhaengigkeiten = ["plattform", "qs", "verwaltung"]   # qs: Originale der Lieferantenunterlagen gehen über qs_eingang_hochladen in den Eingang des QM-Systems · verwaltung: Lieferant eines Containers aus den Stammdaten (lieferanten_kurz)
testgruppen = ["containerimport", "containerimport_whisp", "containerimport_schlachthof", "containerimport_tracking", "containerimport_hafen", "containerimport_farmer", "containerimport_kalkulation"]
pfade = ["regeln/aktionen/containerimport.toml", "app/api/aktionen/containerimport.php", "app/api/aktionen/containerimport_kalkulation.php", "app/api/module/containerimport/**", "app/module/containerimport/**",
  "tests/e2e/test_containerimport*.py", "tests/e2e/containerimport_hilfe.py", "tests/fixtures/containerimport/**", "tests/unit/*ci_kalkulation*"]
pfade_geplant = []
hinweise = [
  "Angelegt auf Wunsch des Inhabers (25.10.2026) als geplante Kachel; Auftrag 18.11.2026: Modul bauen, erster Reiter EUDR (Hilfen und Kontrollen zur Verordnung (EU) 2023/1115). Weitere Reiter (Sendungsverfolgung, Zoll, Kontingente, Dokumente) vor dem Bau mit dem Inhaber klären.",
  "Nicht verwechseln mit der Kachel „Import“ (Datenimport, Teil der Verwaltung).",
  "EUDR: Farmer (im Code „betrieb“, früher „Herkunftsbetriebe“: Produktionsorte) mit Umriss in WGS84; eingelesen aus Entwaldungsberichten der Lieferanten (PDF, im Browser gelesen mit pdf.js aus app/assets/vendor/pdfjs; am Betrieb stehen Name und Prüfsumme der Datei), aus Lieferanten-GeoJSON oder eingefügten Koordinaten. Der Server rechnet UTM um, normalisiert und prüft nach den Regeln des EU-Informationssystems (app/api/module/containerimport/geometrie.php).",
  "Risikoprofil je Container (im Code „sendung“) als Tabelle von Kriterien (eudr_kriterien); abgeleitete Werte (Fläche, Befunde, Profil) werden nie gespeichert – nur der Schnappschuss einer abgeschlossenen Bewertung (GR-106). Nichts wird gelöscht: archivieren, Gegenprüfungen nur ergänzen.",
  "Einstufung der Länder (EUDR_LAENDER) nach Durchführungsverordnung (EU) 2025/1093: bei einer Neufassung der Liste anpassen. Eigene Gegenprüfung über Global Nature Watch und Whisp (FAO) – Verweise und eingetragene Ergebnisse; nichts wird von selbst eingetragen (Karte im Browser und Whisp-Abfrage des Servers: siehe die Hinweise dazu).",
  "Rechte: Modulzugang wie üblich für die Standardrollen; Inhalte erst mit „EUDR ansehen“ (containerimport.eudr_sehen, ohne Standardrolle – Lieferanten- und Herkunftsdaten), speichern mit „EUDR bearbeiten“.",
  "Originale (Entscheidung des Inhabers 18.11.2026): Die eingelesenen Dateien gehen beim Übernehmen in den Eingang des QM-Systems, Ordner „EUDR/<Lieferant>“ – über die Schnittstelle qs_eingang_hochladen (app/api/module/qs/ablage.php), nicht durch Zugriff auf dessen Dokumente (GR-101). Einsortieren und Löschen bleibt dem QM-System (qs.bearbeiten).",
  "Echte Lieferantenunterlagen nie ins Repository (GR-007): Tests nutzen erfundene Betriebe (tests/fixtures/containerimport).",
  "Freigegeben mit dem Merge (Entscheidung des Inhabers 18.11.2026 „gleich Vollgas“, ohne vorherige Testfreigabe): container-import.dashboard-stafl.de mit eigenem Keycloak-Client „containerimport“ (Stand 19); / und /admin/ führen zu /module/containerimport/. Aktionen containerimport_* nur auf diesem Host (GR-109, lib/herkunft.php), dort außer ihnen nur Status und Abmelden. Nur dieser Host liefert die Herkunftskarte aus (/karte/herkunft.pmtiles). Modulzugang wie üblich für die Standardrollen; Inhalte erst mit „EUDR ansehen“.",
  "Karte (Entscheidungen des Inhabers 18.11.2026: um Südamerika und Neuseeland erweitern; danach Satellitenbild und Waldflächen wie in Global Nature Watch und Whisp, Kartendaten direkt im Browser): app/module/containerimport/eudr-karte.js zeichnet über app/assets/detailkarte.js drei Rasterebenen fremder Dienste – Satellitenbild (EOX Sentinel-2 cloudless 2016, CC BY 4.0; spätere Jahrgänge für Unternehmen kostenpflichtig), Wald 2020 (EU-Kommission/JRC, WMS gfc2020_v3), Waldverlust ab 2021 (Hansen/UMD über Global Forest Watch, CC BY 4.0). Zugelassen nur in der Content-Security-Policy des Hosts container-import (Caddyfile, Zuordnung csp_karten; nur img-src und connect-src) – jede neue Adresse dort und in eudr-karte.js eintragen (tests/deploy/test_dashboard_domains.py prüft die Übereinstimmung). Darüber Straßen und Orte aus /karte/herkunft.pmtiles (deploy/karte-laden.sh … herkunft; Alias nur auf dem Host des Moduls, deploy/anmeldung/apache-oidc.conf). Jede Ebene erscheint nur, wenn ihr Dienst antwortet (pruefeDienste, acht Sekunden Frist). Ohne Dienste und ohne Datei Umrisse der Länder aus app/assets/karte.json als SVG.",
  "Bildauswertung (app/module/containerimport/eudr-auswertung.js): schätzt je Fläche Wald Ende 2020 (JRC) und Waldverlust seit 2021 (GFW, unverarbeitete Kachel: Rot 255 = Verlust, Blau = Jahr − 2000) im Browser auf dem Raster der Zoomstufe 12. Nur Anzeige und Vorschlag für das Formular der Gegenprüfung – nie selbst eintragen, nie das Risikoprofil daraus ableiten (Hinweis, kein Nachweis). Vorschlag „Befund“ ab 0,5 ha Verlust auf Wald von 2020; ohne Befund bleibt das Feld „Baumverlust“ leer, weil eudr_betrieb_bewertung dort jede Zahl über 0 als kritisch wertet. Ändert ein Dienst seine Kodierung, erst gegen dessen eingefärbte Fassung prüfen (render_type=true_color).",
  "Container als Mittelpunkt (Entscheidung des Inhabers 19.11.2026): ein Container = ein Einkauf bei einem Lieferanten mit genau einer Partienummer (interne Referenz jedes Wareneinkaufs, Pflicht und eindeutig), dazu Aktennummer und Containernummer (ISO 6346, Prüfziffer nur als Hinweis) und ein Stand gekauft → unterwegs → Dokumente da → angekommen (von Hand, auch nach dem Abschluss der Bewertung). Lieferant = Produzent aus den Stammdaten der Verwaltung (lieferanten_kurz; der Name wird am Container mitgespeichert und bis zum Abschluss der Bewertung bei jedem Speichern aufgefrischt; ohne Treffer freier Text; die Liste zum Auswählen bekommt nur, wer bearbeiten darf). Die Oberfläche sagt „Container“ und „Farmer“, Code, Aktionen und Daten heißen weiter „sendung“ und „betrieb“ (GR-006). Geplant, je eigener PR: Verbindung zum Bestand über die Partienummer; Auswertung je Lieferant; Tracking der Container.",
  "Farmer je Container (Auftrag des Inhabers 19.11.2026): Code in app/api/module/containerimport/farmer.php. Eigene Farmer-Nummer nr (F-0001) = Stelle in der Liste + 1, nur beim Lesen abgeleitet, nie gespeichert – deshalb die Liste der Farmer nie umsortieren und nichts löschen. Daneben die Nummer aus den Papieren (kennung, je Land eindeutig, verglichen über ci_nummern_index; Nummern ohne Inhalt wie „-“ zählen nicht). Nummern ohne Farmer stehen am Container in offeneNummern (ci_nummern_aufloesen: eine Regel für Vorschau, Speichern und das selbsttätige Zuordnen beim Speichern eines Farmers; abgeschlossene Container nie). Gesamtprüfung je Container (ci_farmer_pruefung) nur aus der Ampel der Farmer – keine zweite Bewertung bauen.",
  "Schlachthöfe (Entscheidung des Inhabers 19.11.2026: dem Lieferanten gehören Schlachthöfe, an sie liefern die Farmer): Stammdaten im Dokument containerimport-schlachthoefe (app/api/module/containerimport/schlachthoefe.php, Oberfläche schlachthoefe.js), je Lieferant eindeutiger Name, archivieren statt löschen. Ein Container nennt höchstens einen Schlachthof seines Lieferanten (Annahme: genau einer je Container); sein Name wird für Container mit offener Bewertung beim Lesen aufgelöst und beim Abschluss festgeschrieben (GR-106); der Lieferant eines Schlachthofs mit Containern bleibt, sobald er mit den Stammdaten verknüpft ist. Neue Ansichten des Moduls bekommen eigene Dateien und nutzen die Brücke window.STAFL_CI aus containerimport.js (Ansicht selbst eintragen, eigene Ereignisse).",
  "Reiter Tracking (Auftrag des Inhabers 19.11.2026: wissen, wo ein Container ist und wann er in Hamburg oder Rotterdam ankommt; Schiffsname eintragen): erste Stufe ohne fremde Dienste – Schiff, Reederei, Konnossement, Häfen, Abfahrt und Ankunft sind Felder am Container (app/api/module/containerimport/tracking.php, Oberfläche tracking.js), Aktion containerimport_tracking_save, auch nach dem Abschluss der Bewertung. Verweise zur Sendungsverfolgung der Reedereien nur in CI_REEDEREIEN. Vor jedem Abruf weiterer fremder Stellen (HVCC-Schnittstelle, Tracking-Dienst) Entscheidung des Inhabers; bei einem Tracking-Dienst gingen Containernummern an Dritte.",
  "Tracking, Ankunft in Hamburg (Zustimmung des Inhabers 19.11.2026): app/api/module/containerimport/hafen.php ruft die öffentliche Liste „Expected vessels“ von hafen-hamburg.de ab (Quelle dort HVCC; nur der Server, höchstens alle zwei Stunden, nur wenn ein Container mit Schiff und Zielhafen Hamburg unterwegs ist; nur die erste Seite). Hinaus geht nichts Eigenes außer dem Absender im Abruf. Meldungen liegen mit Abrufzeit in containerimport-hafenmeldungen und werden beim Lesen über den Schiffsnamen dazugestellt – nie in die Felder des Containers schreiben, nie Stand oder Ankunft von selbst ändern. Nie unter der Speichersperre abrufen (SQLite: die Sperre gilt der ganzen Datenbank). Aufbau der Seite: tests/fixtures/containerimport/hafen-hamburg.html; ändert er sich, ci_hafen_hh_lesen anpassen. Tests rufen den echten Hafen nie ab (tests/run_e2e.py setzt WA_HAFEN_HH_URL für jede Gruppe). Die HVCC-Schnittstelle (lange Vorausschau) und ein Tracking-Dienst brauchen Zugangsdaten und eine Entscheidung des Inhabers.",
  "Whisp-Abfrage (Auftrag des Inhabers 19.11.2026; app/api/module/containerimport/whisp.php, Aktion containerimport_eudr_whisp): der Server schickt nur den Umriss an whisp.openforis.org, Schlüssel WHISP_API_KEY nur in .env und nur im Mitarbeiter-Container (ein Jahr gültig). Speichert nichts – Vorschlag für das Formular der Gegenprüfung (eudr-whisp.js). Für Rinder gibt Whisp noch kein Risiko aus (risk_cattle angekündigt, hat in deuten() schon Vorrang); bis dahin „Befund“ nach der Regel für Ackerkulturen und „ohne Befund“ nur ohne merkliche Störung nach 2020 – sonst kein Vorschlag, die Auswahl bleibt leer (nie still „ohne Befund“). Nur Umrisse, keine Punkte. Jeder Versand steht im Aktivitätsprotokoll. Schnittstelle bei Änderungen prüfen: https://whisp.openforis.org/api/openapi.json.",
  "Kalkulation je Container (Auftrag des Inhabers 20.11.2026): Rechenkern ci_kalkulation_rechnen in app/api/module/containerimport/kalkulation.php – eine reine Funktion, nur auf dem Server (Unit-Test tests/unit/test_ci_kalkulation.py); Oberfläche kalkulation.js (Reiter „Kalkulation“). Zollsätze nur in CI_KALK_SAETZE mit Quelle (vor Verwendung in TARIC prüfen), je Kalkulation überschreibbar nur mit Vermerk. Dokument containerimport-kalkulationen: je Container Fassungen; Entwurf rechnet mit den aktuellen Sätzen, „endgültig festschreiben“ hält die geprüfte Eingabe, das Ergebnis (darin die wirksamen Sätze) und den Container fest (GR-106); danach nur neue Fassung mit Grund, nie löschen (GoBD). Versicherung je Position nach Wert (Prämie des Teils), unmögliche Kombinationen Ursprung/Zollregime/Datum sind Fehler. Sichtbar für jeden mit „EUDR ansehen“ (Entscheidung des Inhabers 20.11.2026, auch Einkaufs-/Verkaufspreise und Margen). Echte Kalkulationen nie ins Repository (GR-007).",
]

