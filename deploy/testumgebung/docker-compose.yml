# Testumgebung (test.<Domain>) – wird von deploy/testumgebung.sh nach /opt/wochenangebot-test kopiert und dort
# gestartet. Getrennt vom Echtbetrieb: eigener Code-Stand (src/), eigene Testdaten (daten/), kein E-Mail-Versand.
name: wochenangebot-test
services:
  app-test:
    image: php:8.3-apache@sha256:9f1f03b7e093c8e70227d782e31a305590ab71d7b48c076589dcc92ba8c9300c   # wie docker-compose.yml (tests/deploy/test_images.py)
    restart: unless-stopped
    logging:                        # Container-Protokoll begrenzt: höchstens 3 × 10 MB je Dienst (sonst wächst es unbegrenzt)
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    volumes:
      - ./src/app:/var/www/html:ro                                              # Code des eingespielten Zweigs (nur lesend)
      - ./daten:/var/www/html/data                                              # nur Testdaten
      - ./apache-schutz.conf:/etc/apache2/conf-enabled/zz-testumgebung.conf:ro  # Passwortschutz der ganzen Seite
      - ./zugang.htpasswd:/etc/apache2/testumgebung.htpasswd:ro
    environment:
      WA_TESTUMGEBUNG: "1"        # Kennzeichen, E-Mails nur ins Testpostfach
      DOMAIN: ${TEST_DOMAIN}      # Links in (Test-)E-Mails
      WA_TRUSTED_PROXIES: wa-caddy  # Besucher-IP nur vom Caddy des Echtbetriebs übernehmen
    networks: [edge]
networks:
  edge:                           # eigenes Netz nur mit dem Caddy des Echtbetriebs – nicht das Netz der Produktiv-App
    name: wochenangebot-edge
    external: true
