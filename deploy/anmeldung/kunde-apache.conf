# Apache-Härtung der Kundenseite angebot-stafl.de (Container app, ADR-007 „Härtung des Kundencontainers“) – nur dort eingebunden
# (deploy/anmeldung/docker-compose.anmeldung.yml). Version und Betriebssystem nicht verraten, keine TRACE-Anfragen; der Name
# beendet nur die Warnung beim Start (Apache läuft hinter Caddy, Hosts prüft die Anwendung).
ServerName angebot-stafl.de
ServerTokens Prod
ServerSignature Off
TraceEnable Off
