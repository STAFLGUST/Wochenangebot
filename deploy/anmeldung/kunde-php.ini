; PHP-Härtung der Kundenseite angebot-stafl.de (Container app, ADR-007 „Härtung des Kundencontainers“).
; Nur dort geladen (PHP_INI_SCAN_DIR in deploy/anmeldung/docker-compose.anmeldung.yml), nicht in app-mitarbeiter oder postausgang.
; Geprüft mit tests/deploy/test_kundencontainer.sh.

; Keine Programme starten und keine Prozesse steuern (die Anwendung braucht nichts davon), keine Mails direkt (Postausgang von
; innen), keine Umgebung verändern, keine Verweise anlegen, keine Diagnoseseiten.
disable_functions = exec,shell_exec,system,passthru,proc_open,popen,proc_close,proc_get_status,proc_nice,proc_terminate,pcntl_exec,pcntl_fork,dl,mail,putenv,symlink,link,phpinfo,show_source,highlight_file,posix_kill,posix_setuid,posix_setgid,posix_mkfifo

; Dateien nur unter der Anwendung (mit Datenordner) und in /tmp (Sitzungen, Zwischendateien)
open_basedir = /var/www/html:/tmp

; Die Kundenseite nimmt keine Datei-Uploads an (die Anwendung nutzt $_FILES nirgends)
file_uploads = Off

; Fremde Adressen nie als PHP-Code einbinden; Version nicht verraten; Fehler nur ins Protokoll
allow_url_include = Off
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
