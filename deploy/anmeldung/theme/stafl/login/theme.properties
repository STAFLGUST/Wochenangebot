# STAFL-Plattform – Anmeldeseite von Keycloak im Plattform-Design „Liquid Glass“ (wie dashboard/dashboard.css und der
# Eingabebereich). Erbt alles vom mitgelieferten Theme keycloak.v2 (Keycloak 26.8.1); eigen sind nur Stylesheet, ein
# kleines Skript für die Einmalcode-Felder, deutsche Texte und zwei Vorlagen (login-otp.ftl, login-config-totp.ftl).
# Eingebunden per Volume (deploy/anmeldung/docker-compose.anmeldung.yml), aktiv mit: sh deploy/anmeldung/konten.sh design-setzen
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/stafl.css
scripts=js/stafl-otp.js
darkMode=true
locales=de
