# STAFL-Plattform – Anmeldeseite von Keycloak im Plattform-Design „C2“ (seit 10.11.2026, wie Dashboard und Module: Farben
# der --r-* aus app/assets/rahmen.css, Schrift Geist, kein Glas). Erbt alles vom mitgelieferten Theme keycloak.v2
# (Keycloak 26.8.2); eigen sind nur Stylesheet, Schriften (resources/fonts, wie app/assets/fonts), ein kleines Skript für
# die Einmalcode-Felder, deutsche Texte und zwei Vorlagen (login-otp.ftl, login-config-totp.ftl).
# Eingebunden per Volume (deploy/anmeldung/docker-compose.anmeldung.yml), aktiv mit: sh deploy/anmeldung/konten.sh design-setzen
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/stafl.css
scripts=js/stafl-otp.js
darkMode=true
locales=de
