# STAFL-Plattform – deutsche Texte der Anmeldeseite (ergänzen bzw. ersetzen die Texte von keycloak.v2/base).
# Nur Texte: Sicherheitsverhalten (Sperre nach Fehlversuchen, Einmalcode-Richtlinie, Abläufe) bleibt unverändert.

# Kopf: nur das Logo (Wunsch des Inhabers, wie im Dashboard); der Name bleibt für Screenreader
loginTitleHtml=<span class="stafl-sr">STAFL-Plattform – Anmeldung</span>
loginTitle=Anmeldung · {0}
loginAccountTitle=Anmelden

# Einmalcode bei der Anmeldung
loginOtpOneTime=Einmalcode
staflOtpHinweis=Code aus der App „{0}“ verwenden. Die Codes wechseln alle 30 Sekunden und gelten nur einmal – wurde ein Code abgelehnt, auf den nächsten warten.
staflOtpFormat=6 Ziffern aus der App (Leerzeichen werden entfernt)
missingTotpMessage=Bitte den 6-stelligen Einmalcode aus der App eingeben.
# Falscher Code und vorübergehende Sperre nach Fehlversuchen bewusst mit demselben Text (Keycloak verrät die Sperre nicht –
# der Hinweis erklärt aber, warum auch ein richtiger Code eine Weile nicht angenommen wird)
invalidTotpMessage=Der Einmalcode wurde nicht angenommen. Jeder Code gilt nur einmal: Wurde dieser Code gerade schon benutzt (zum Beispiel in einem anderen Fenster), bitte warten, bis die App einen neuen Code zeigt, und diesen eingeben. Nach mehreren Fehlversuchen ist die Anmeldung einige Minuten gesperrt – dann kurz warten oder die Verwaltung bitten, das Konto zu entsperren.
accountTemporarilyDisabledMessageTotp=Der Einmalcode wurde nicht angenommen. Jeder Code gilt nur einmal: Wurde dieser Code gerade schon benutzt (zum Beispiel in einem anderen Fenster), bitte warten, bis die App einen neuen Code zeigt, und diesen eingeben. Nach mehreren Fehlversuchen ist die Anmeldung einige Minuten gesperrt – dann kurz warten oder die Verwaltung bitten, das Konto zu entsperren.
accountPermanentlyDisabledMessageTotp=Der Einmalcode wurde nicht angenommen. Jeder Code gilt nur einmal: Wurde dieser Code gerade schon benutzt (zum Beispiel in einem anderen Fenster), bitte warten, bis die App einen neuen Code zeigt, und diesen eingeben. Nach mehreren Fehlversuchen ist die Anmeldung einige Minuten gesperrt – dann kurz warten oder die Verwaltung bitten, das Konto zu entsperren.

# Benutzername und Passwort (ebenfalls gleicher Text für „falsch“ und „vorübergehend gesperrt“)
invalidUserMessage=Benutzername oder Passwort stimmt nicht. Nach mehreren Fehlversuchen ist die Anmeldung einige Minuten gesperrt – dann kurz warten oder die Verwaltung bitten, das Konto zu entsperren.
accountTemporarilyDisabledMessage=Benutzername oder Passwort stimmt nicht. Nach mehreren Fehlversuchen ist die Anmeldung einige Minuten gesperrt – dann kurz warten oder die Verwaltung bitten, das Konto zu entsperren.

# Einmalcode einrichten
loginTotpTitle=Einmalcode einrichten
staflTotpAltTitel=Wichtig: alte Einträge zuerst löschen
staflTotpAltText=Steht in Ihrer Authenticator-App schon ein Eintrag „{0}“ (zum Beispiel von einer früheren Einrichtung), löschen Sie ihn jetzt. Sonst nehmen Sie später leicht den alten Code – die Anmeldung meldet dann „Der Einmalcode stimmt nicht“.
loginTotpStep1=Installieren Sie eine Authenticator-App auf Ihrem Smartphone, zum Beispiel:
loginTotpStep2=Öffnen Sie die App und scannen Sie den QR-Code. Der neue Eintrag heißt „{0}“.
loginTotpManualStep2=Öffnen Sie die App und geben Sie diesen Schlüssel ein:
loginTotpStep3=Geben Sie den 6-stelligen Code ein, den die App gerade anzeigt, und klicken Sie auf „Absenden“.
loginTotpStep3DeviceName=Ein Gerätename (z. B. „Diensthandy“) hilft, den Eintrag später wiederzufinden.
loginTotpUnableToScan=QR-Code lässt sich nicht scannen?
loginTotpScanBarcode=Doch lieber den QR-Code scannen?
authenticatorCode=Einmalcode
loginTotpDeviceName=Gerätename
staflTotpCodeHinweis=Den Code nehmen, den die App für den neuen Eintrag „{0}“ gerade anzeigt.
configureTotpMessage=Für Ihr Konto ist ein Einmalcode vorgeschrieben – bitte jetzt einrichten.
requiredAction.CONFIGURE_TOTP=Einmalcode einrichten
