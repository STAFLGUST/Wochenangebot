# STAFL-Plattform – Keycloak-Hosts im Anwendungs-Container (ADR-003). Aktiv seit der Inbetriebnahme (Oktober 2026).
# Wird als sites-enabled/zz-stafl-oidc.conf eingebunden (nach 000-default): angebot-stafl.de bleibt der Standard-Host und
# verhält sich unverändert (eigene Anmeldung bis zur Umstellung). Grundlage ist die in der CI geprüfte Testkonfiguration
# tests/oidc/apache.conf – Abweichungen nur bei Hosts, Ports und TLS (hier echte Zertifikate über Caddy).
LoadModule auth_openidc_module /usr/lib/apache2/modules/mod_auth_openidc.so

OIDCProviderMetadataURL ${OIDC_ISSUER}/.well-known/openid-configuration
OIDCSSLValidateServer On
OIDCResponseType code
OIDCPKCEMethod S256
OIDCScope "openid"
OIDCProviderTokenEndpointAuth client_secret_basic
OIDCCacheType shm
OIDCSessionType server-cache
OIDCSessionInactivityTimeout 14400
OIDCSessionMaxDuration 36000
# Rückkehr von der Anmeldung bis 30 Minuten gültig (Standard 5 – zu knapp bei Einmalcode-Problemen); danach bzw. ohne
# passenden Zustand (anderer Tab, Lesezeichen auf /oidc/callback) leitet OIDCDefaultURL je Host neu weiter statt „Bad Request“
OIDCStateTimeout 1800
OIDCCookieSameSite On
OIDCCookieHTTPOnly On
OIDCStateCookiePrefix "__Host-oidc_state_"
OIDCXForwardedHeaders X-Forwarded-Proto
OIDCRemoteUserClaim sub
OIDCPassClaimsAs environment
OIDCClaimPrefix OIDC_CLAIM_
OIDCPassIDTokenAs claims
OIDCPassRefreshToken Off
OIDCPassAccessToken Off
OIDCAuthNHeader X-Nie-Verwendet
OIDCRedirectURLsAllowed ^https://(dashboard-stafl\.de|angebot\.dashboard-stafl\.de|verwaltung\.dashboard-stafl\.de|bestand\.dashboard-stafl\.de|hr\.dashboard-stafl\.de|crm\.dashboard-stafl\.de|marketing\.dashboard-stafl\.de|sicherheit\.dashboard-stafl\.de)/([^/]|$)

# Detailkarte (deploy/karte-laden.sh): genau eine Datei, nur auf den Hosts von Verwaltung (Auswertung) und CRM (Karte) und
# nur mit Anmeldung (Location / der Hosts). HTTP-Range liefert Apache selbst; nie komprimieren (Byte-Bereiche).
<Directory /var/www/karte>
	Options -Indexes
	AllowOverride None
	Require all granted
	SetEnv no-gzip 1
	<IfModule mod_headers.c>
		Header set Cache-Control "private, max-age=3600, no-transform"
	</IfModule>
	# nur die Kartendatei: das Adressverzeichnis (deploy/adressen-laden.sh) und Stand-Dateien liest nur PHP
	<FilesMatch "^(?!karte\.pmtiles$)">
		Require all denied
	</FilesMatch>
</Directory>

# Dashboard liegt außerhalb der Dokumentwurzel und ist nur auf den Keycloak-Hosts erreichbar
<Directory /var/www/dashboard>
	Options -Indexes
	AllowOverride None
	Require all granted
</Directory>

<VirtualHost *:80>
	ServerName https://dashboard-stafl.de
	SetEnv WA_OIDC 1
	SetEnv WA_OIDC_ISSUER ${OIDC_ISSUER}
	SetEnv WA_OIDC_ACR mfa
	SetEnv WA_OBERFLAECHE dashboard.start
	OIDCClientID dashboard
	OIDCClientSecret "${OIDC_SECRET_DASHBOARD}"
	OIDCCryptoPassphrase "${OIDC_CRYPTO_DASHBOARD}"
	OIDCRedirectURI https://dashboard-stafl.de/oidc/callback
	OIDCCookie "__Host-oidc_sitzung"
	OIDCDefaultLoggedOutURL https://dashboard-stafl.de/dashboard/abgemeldet.html
	OIDCDefaultURL https://dashboard-stafl.de/
	Alias /dashboard /var/www/dashboard
	RedirectMatch 302 ^/$ /dashboard/
	<Location />
		AuthType openid-connect
		Require valid-user
	</Location>
	<Location /api/>
		AuthType openid-connect
		OIDCUnAuthAction 401
		Require valid-user
	</Location>
	<LocationMatch "^/(dashboard/abgemeldet\.html|dashboard/dashboard\.css|assets/)">
		AuthType None
		Require all granted
	</LocationMatch>
</VirtualHost>

