# STAFL-Plattform – Keycloak-Hosts im Anwendungs-Container (ADR-003). NOCH NICHT AKTIV.
# Wird als sites-enabled/zz-stafl-oidc.conf eingebunden (nach 000-default): angebot-stafl.de bleibt der Standard-Host und
# verhält sich unverändert (eigene Anmeldung bis zur Umstellung). Grundlage ist die in der CI geprüfte Testkonfiguration
# tests/oidc/apache.conf – Abweichungen nur bei Hosts, Ports und TLS (hier echte Zertifikate über Caddy).
LoadModule auth_openidc_module /usr/lib/apache2/modules/mod_auth_openidc.so

OIDCProviderMetadataURL ${OIDC_ISSUER}/.well-known/openid-configuration
OIDCSSLValidateServer On
OIDCResponseType code
OIDCPKCEMethod S256
OIDCScope "openid"
OIDCProviderTokenEndpointAuth client_secret_basic
OIDCCacheType shm
OIDCSessionType server-cache
OIDCSessionInactivityTimeout 14400
OIDCSessionMaxDuration 36000
OIDCCookieSameSite On
OIDCCookieHTTPOnly On
OIDCStateCookiePrefix "__Host-oidc_state_"
OIDCXForwardedHeaders X-Forwarded-Proto
OIDCRemoteUserClaim sub
OIDCPassClaimsAs environment
OIDCClaimPrefix OIDC_CLAIM_
OIDCPassIDTokenAs claims
OIDCPassRefreshToken Off
OIDCPassAccessToken Off
OIDCAuthNHeader X-Nie-Verwendet
OIDCRedirectURLsAllowed ^https://(dashboard-stafl\.de|angebot\.dashboard-stafl\.de)/([^/]|$)

# Dashboard liegt außerhalb der Dokumentwurzel und ist nur auf den beiden Keycloak-Hosts erreichbar
<Directory /var/www/dashboard>
	Options -Indexes
	AllowOverride None
	Require all granted
</Directory>

<VirtualHost *:80>
	ServerName https://dashboard-stafl.de
	SetEnv WA_OIDC 1
	SetEnv WA_OIDC_ISSUER ${OIDC_ISSUER}
	SetEnv WA_OIDC_ACR mfa
	OIDCClientID dashboard
	OIDCClientSecret "${OIDC_SECRET_DASHBOARD}"
	OIDCCryptoPassphrase "${OIDC_CRYPTO_DASHBOARD}"
	OIDCRedirectURI https://dashboard-stafl.de/oidc/callback
	OIDCCookie "__Host-oidc_sitzung"
	OIDCDefaultLoggedOutURL https://dashboard-stafl.de/dashboard/abgemeldet.html
	Alias /dashboard /var/www/dashboard
	RedirectMatch 302 ^/$ /dashboard/
	<Location />
		AuthType openid-connect
		Require valid-user
	</Location>
	<Location /api/>
		AuthType openid-connect
		OIDCUnAuthAction 401
		Require valid-user
	</Location>
	<LocationMatch "^/(dashboard/abgemeldet\.html|dashboard/dashboard\.css|assets/)">
		AuthType None
		Require all granted
	</LocationMatch>
</VirtualHost>

<VirtualHost *:80>
	ServerName https://angebot.dashboard-stafl.de
	SetEnv WA_OIDC 1
	SetEnv WA_OIDC_ISSUER ${OIDC_ISSUER}
	SetEnv WA_OIDC_ACR mfa
	OIDCClientID angebot
	OIDCClientSecret "${OIDC_SECRET_ANGEBOT}"
	OIDCCryptoPassphrase "${OIDC_CRYPTO_ANGEBOT}"
	OIDCRedirectURI https://angebot.dashboard-stafl.de/oidc/callback
	OIDCCookie "__Host-oidc_sitzung"
	OIDCDefaultLoggedOutURL https://angebot.dashboard-stafl.de/dashboard/abgemeldet.html
	Alias /dashboard /var/www/dashboard
	RedirectMatch 302 ^/$ /admin/
	<Location />
		AuthType openid-connect
		Require valid-user
	</Location>
	<Location /api/>
		AuthType openid-connect
		OIDCUnAuthAction 401
		Require valid-user
	</Location>
	<LocationMatch "^/(dashboard/abgemeldet\.html|dashboard/dashboard\.css|assets/)">
		AuthType None
		Require all granted
	</LocationMatch>
</VirtualHost>
