# HR (Urlaubsverwaltung): eigene Seite /module/hr/ derselben Anwendung; die Schnittstelle beantwortet hier nur die
# Aktionen von hr.intern sowie Status und Abmelden (GR-109, lib/herkunft.php). Rechte prüft weiter jede Aktion (GR-103)
<VirtualHost *:80>
	ServerName https://hr.dashboard-stafl.de
	SetEnv WA_OIDC 1
	SetEnv WA_OIDC_ISSUER ${OIDC_ISSUER}
	SetEnv WA_OIDC_ACR mfa
	SetEnv WA_OBERFLAECHE hr.intern
	OIDCClientID hr
	OIDCClientSecret "${OIDC_SECRET_HR}"
	OIDCCryptoPassphrase "${OIDC_CRYPTO_HR}"
	OIDCRedirectURI https://hr.dashboard-stafl.de/oidc/callback
	OIDCCookie "__Host-oidc_sitzung"
	OIDCDefaultLoggedOutURL https://hr.dashboard-stafl.de/dashboard/abgemeldet.html
	OIDCDefaultURL https://hr.dashboard-stafl.de/
	Alias /dashboard /var/www/dashboard
	RedirectMatch 302 ^/$ /module/hr/
	# Kein Eingabebereich auf diesem Host (auch nicht über den Anmeldehinweis der Seite): zurück zur Urlaubsverwaltung
	RedirectMatch 302 ^/admin(/.*)?$ /module/hr/
	<Location />
		AuthType openid-connect
		Require valid-user
	</Location>
	<Location /api/>
		AuthType openid-connect
		OIDCUnAuthAction 401
		Require valid-user
	</Location>
	<LocationMatch "^/(dashboard/abgemeldet\.html|dashboard/dashboard\.css|assets/)">
		AuthType None
		Require all granted
	</LocationMatch>
</VirtualHost>

