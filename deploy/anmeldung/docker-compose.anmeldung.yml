# STAFL-Plattform – zentrale Anmeldung im Betrieb (ADR-003, Roadmap: Inbetriebnahme). Aktiv über COMPOSE_FILE in .env (Schritt 5).
#
# Ergänzt docker-compose.yml, ohne es zu ändern (eine Änderung dort startet beim Release die Container neu):
#   docker compose -f docker-compose.yml -f deploy/anmeldung/docker-compose.anmeldung.yml up -d
# Nur nach ausdrücklicher Freigabe des Inhabers und in der Reihenfolge aus docs/plattform/inbetriebnahme-anmeldung.md.
# Alle Images fest über Version und Digest. Geheimnisse nur in .env auf dem Server (Namen: deploy/anmeldung/LIESMICH.md).
#
# Zwei Anwendungs-Container aus demselben Image und demselben Code (ADR-007, docs/plattform/adr-007-kundencontainer.md):
#   app              – nur die Kundenseite angebot-stafl.de: keine Anmelde-Geheimnisse, kein Dashboard, nur im Netz „default“
#                      mit Caddy (Keycloak und app-mitarbeiter von dort nicht erreichbar), Dateisystem nur lesbar, Grenzen für
#                      Speicher, Rechenzeit und Prozesse. Baut das gemeinsame Image.
#   app-mitarbeiter  – alle Mitarbeiter-Hosts (dashboard-stafl.de und *.dashboard-stafl.de) mit Keycloak-Anmeldung,
#                      Dashboard, Detailkarte und allen Anmelde-Geheimnissen; im Netz „intern“ mit Caddy und Keycloak.
#   postausgang      – verschickt die E-Mails, die die Kundenseite nur als Auftrag ablegt (Postausgang von innen, ADR-007): nur
#                      hier und in app-mitarbeiter gibt es Postfach-Zugangsdaten und den Schlüssel des hinterlegten Postfach-Passworts
#                      (Ordner daten-geheim, nie in der Kundenseite). Kein Port, eigenes Netz nur mit Ausgang ins Internet (SMTP).
# Alle nutzen den Datenordner daten/. Nach der Datentrennung (ADR-007 Stufe 2, sh deploy/daten-trennen.sh trennen) liegen interne
# Dokumente (Personal, Nutzer, CRM, Controlling, QS, Dateiablage …) in daten-intern/ – nur app-mitarbeiter und postausgang.
services:
  app:
    # Kundenseite angebot-stafl.de (ADR-007): dasselbe Anwendungs-Image wie app-mitarbeiter (deploy/image, in der CI gebaut und
    # mit php:8.3-apache verglichen), aber ohne Keycloak-Hosts in Apache, ohne Dashboard und ohne Anmelde-Geheimnisse. Allein mit
    # Caddy im Netz „kunde“ (ohne Ausgang ins Internet) – Keycloak und app-mitarbeiter liegen im Netz „intern“ und sind von hier
    # nicht erreichbar. Härtung: ADR-007, Abschnitt „Härtung des Kundencontainers“; geprüft mit tests/deploy/test_kundencontainer.sh.
    image: stafl-app:${STAFL_APP_VERSION:-lokal}
    build: ./deploy/image                                  # baut das gemeinsame Image (auch für app-mitarbeiter)
    environment:
      # Alter Eingabebereich angebot-stafl.de/admin/ mit eigener Anmeldung stillgelegt (Entscheidung Inhaber 23.10.2026) – fest:
      # die Kundenseite öffnet ihn nie wieder (ADR-007 Regel 6). Notzugang bei gestörter Anmeldung nur noch über einen SSH-Tunnel
      # zu app-mitarbeiter (sh deploy/notzugang.sh an). Kundenseite und Kundenanmeldung unverändert.
      WA_EIGENE_ANMELDUNG: "aus"
      # Postausgang von innen (ADR-007, lib/postausgang.php): die Kundenseite legt E-Mails nur als Auftrag ab und kennt kein
      # Postfach – die Werte aus docker-compose.yml werden hier geleert; verschickt wird nur im Dienst postausgang
      WA_POSTAUSGANG: "warteschlange"
      MAIL_SMTP_HOST: ""
      MAIL_SMTP_PORT: ""
      MAIL_SMTP_SECURE: ""
      MAIL_SMTP_USER: ""
      MAIL_SMTP_PASS: ""
      MAIL_FROM: ""
      MAIL_FROM_NAME: ""
      MAIL_REPLY_TO: ""
      # PHP-Härtung nur für die Kundenseite (zusätzlich zu den Einstellungen des Images): keine Programme starten, keine
      # Uploads, Dateizugriff nur auf Anwendung, Datenordner und /tmp – deploy/anmeldung/kunde-php.ini
      PHP_INI_SCAN_DIR: ":/usr/local/etc/php/kunde.d"
      # Datenleck-Prüfung der Kundenpasswörter (lib/nutzer.php) über das Relais in Caddy – der einzige Weg nach außen
      WA_PWNED_URL: "http://caddy:8081/range/%s"
    volumes:
      - ./deploy/anmeldung/kunde-php.ini:/usr/local/etc/php/kunde.d/zz-kunde.ini:ro
      - ./deploy/anmeldung/kunde-apache.conf:/etc/apache2/conf-enabled/zz-kunde.conf:ro
    # Härtung (ADR-007):
    # – läuft vollständig als www-data (auch der Apache-Hauptprozess) und ohne jede Linux-Sonderberechtigung; Port 80 öffnet
    #   Apache dank der Einstellung des eigenen Netz-Namensraums (ip_unprivileged_port_start) ohne Root-Rechte
    # – Dateisystem nur lesbar (Anwendung ohnehin nur lesend eingebunden, Daten im Datenordner); Apache und PHP schreiben nur in
    #   /tmp (Sitzungen) und /run (PID, Sperren) – dort lässt sich nichts ausführen (noexec)
    # – keine Rechteausweitung über setuid-Programme; Standardprofil seccomp (und AppArmor, wo der Server es hat)
    user: "33:33"
    cap_drop:
      - ALL
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m,noexec,nosuid,nodev
      - /run:mode=1777,size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    # Grenzen: Überlast auf der öffentlichen Seite bremst die Mitarbeiter-Hosts nicht aus (Server: Hostinger KVM 8,
    # 8 vCPU / 32 GB). Anpassbar über .env (KUNDEN_CPUS, KUNDEN_SPEICHER).
    cpus: ${KUNDEN_CPUS:-3}
    mem_limit: ${KUNDEN_SPEICHER:-4g}
    pids_limit: 1024
    networks:
      kunde:                                               # nur Caddy; ersetzt „default“ (kein Ausgang ins Internet)

  app-mitarbeiter:
    # Mitarbeiter-Hosts (ADR-003, ADR-007): dashboard-stafl.de, angebot./verwaltung./bestand./hr./crm./marketing./sicherheit./
    # controlling./leergut./rewe./qs.dashboard-stafl.de und die Prüfung vor der Anmeldeseite (Caddy forward_auth). Gleiches Image
    # und gleicher Code wie app; das Image baut der Dienst app (nie aus dem Netz holen).
    image: stafl-app:${STAFL_APP_VERSION:-lokal}
    pull_policy: never
    restart: unless-stopped
    logging:                        # Container-Protokoll begrenzt: höchstens 3 × 10 MB je Dienst (sonst wächst es unbegrenzt)
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    volumes:
      - ./app:/var/www/html:ro      # Website (nur lesend) – wie app
      - ./daten:/var/www/html/data  # gemeinsamer Datenordner (Stufe 1, ADR-007)
      - ./dashboard:/var/www/dashboard:ro                 # Dashboard (außerhalb von app/; per Alias nur auf den Keycloak-Hosts)
      - ./deploy/anmeldung/apache-oidc.conf:/etc/apache2/sites-enabled/zz-stafl-oidc.conf:ro   # Keycloak-Hosts in Apache
      - ./daten-karte:/var/www/karte:ro                   # Detailkarte (deploy/karte-laden.sh); fehlt sie, zeigen die Seiten die Übersichtskarte
      - ./daten-geheim:/var/www/geheim                    # Schlüssel des hinterlegten Postfach-Passworts (nicht in der Kundenseite, nicht gesichert)
      - ./daten-intern:/var/www/daten-intern              # interne Daten nach deploy/daten-trennen.sh (ADR-007 Stufe 2; nicht in der Kundenseite)
    environment:
      # wie app in docker-compose.yml (die CI prüft, dass hier nichts davon fehlt: deploy/anmeldung/pruefen.sh)
      WA_INSTALLED: "1"
      WA_TRUSTED_PROXIES: caddy
      DOMAIN: ${DOMAIN}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_SECURE: ${MAIL_SMTP_SECURE:-starttls}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASS: ${MAIL_SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      # Anmeldung über Keycloak – nur in diesem Container
      OIDC_ISSUER: https://login.dashboard-stafl.de/realms/mitarbeiter
      OIDC_SECRET_DASHBOARD: ${OIDC_SECRET_DASHBOARD:?in .env setzen}
      OIDC_SECRET_ANGEBOT: ${OIDC_SECRET_ANGEBOT:?in .env setzen}
      OIDC_CRYPTO_DASHBOARD: ${OIDC_CRYPTO_DASHBOARD:?in .env setzen}
      OIDC_CRYPTO_ANGEBOT: ${OIDC_CRYPTO_ANGEBOT:?in .env setzen}
      # Verwaltung (verwaltung.dashboard-stafl.de): Werte erzeugt konten.sh realm-aktualisieren bzw. einrichten.sh. Bis dahin
      # startet die Anwendung trotzdem (Release vor dem Konsolenschritt): Schlüssel wie beim Eingabebereich, Client fehlt in Keycloak
      OIDC_SECRET_VERWALTUNG: ${OIDC_SECRET_VERWALTUNG:-noch-nicht-eingerichtet}
      OIDC_CRYPTO_VERWALTUNG: ${OIDC_CRYPTO_VERWALTUNG:-${OIDC_CRYPTO_ANGEBOT:?in .env setzen}}
      # Bestand (bestand.dashboard-stafl.de, Stand 4): wie bei der Verwaltung – startbar vor dem Konsolenschritt
      OIDC_SECRET_BESTAND: ${OIDC_SECRET_BESTAND:-noch-nicht-eingerichtet}
      OIDC_CRYPTO_BESTAND: ${OIDC_CRYPTO_BESTAND:-${OIDC_CRYPTO_ANGEBOT:?in .env setzen}}
      # HR (hr.dashboard-stafl.de, Stand 5): wie bei der Verwaltung – startbar vor dem Konsolenschritt
      OIDC_SECRET_HR: ${OIDC_SECRET_HR:-noch-nicht-eingerichtet}
      OIDC_CRYPTO_HR: ${OIDC_CRYPTO_HR:-${OIDC_CRYPTO_ANGEBOT:?in .env setzen}}
      # CRM (crm.dashboard-stafl.de, Stand 6): wie bei der Verwaltung – startbar vor dem Konsolenschritt
      OIDC_SECRET_CRM: ${OIDC_SECRET_CRM:-noch-nicht-eingerichtet}
      OIDC_CRYPTO_CRM: ${OIDC_CRYPTO_CRM:-${OIDC_CRYPTO_ANGEBOT:?in .env setzen}}
      # Marketing (marketing.dashboard-stafl.de, Stand 7): wie bei der Verwaltung – startbar vor dem Konsolenschritt
      OIDC_SECRET_MARKETING: ${OIDC_SECRET_MARKETING:-noch-nicht-eingerichtet}
      OIDC_CRYPTO_MARKETING: ${OIDC_CRYPTO_MARKETING:-${OIDC_CRYPTO_ANGEBOT:?in .env setzen}}
      # Sicherheit (sicherheit.dashboard-stafl.de, Stand 9): wie bei der Verwaltung – startbar vor dem Konsolenschritt
      OIDC_SECRET_SICHERHEIT: ${OIDC_SECRET_SICHERHEIT:-noch-nicht-eingerichtet}
      OIDC_CRYPTO_SICHERHEIT: ${OIDC_CRYPTO_SICHERHEIT:-${OIDC_CRYPTO_ANGEBOT:?in .env setzen}}
      # Controlling (controlling.dashboard-stafl.de, Stand 10): wie bei der Verwaltung – startbar vor dem Konsolenschritt
      OIDC_SECRET_CONTROLLING: ${OIDC_SECRET_CONTROLLING:-noch-nicht-eingerichtet}
      OIDC_CRYPTO_CONTROLLING: ${OIDC_CRYPTO_CONTROLLING:-${OIDC_CRYPTO_ANGEBOT:?in .env setzen}}
      # Leergut (leergut.dashboard-stafl.de, Stand 11): wie bei der Verwaltung – startbar vor dem Konsolenschritt
      OIDC_SECRET_LEERGUT: ${OIDC_SECRET_LEERGUT:-noch-nicht-eingerichtet}
      OIDC_CRYPTO_LEERGUT: ${OIDC_CRYPTO_LEERGUT:-${OIDC_CRYPTO_ANGEBOT:?in .env setzen}}
      # REWE (rewe.dashboard-stafl.de, Stand 12): wie bei der Verwaltung – startbar vor dem Konsolenschritt
      OIDC_SECRET_REWE: ${OIDC_SECRET_REWE:-noch-nicht-eingerichtet}
      OIDC_CRYPTO_REWE: ${OIDC_CRYPTO_REWE:-${OIDC_CRYPTO_ANGEBOT:?in .env setzen}}
      # Qualitätssicherung (qs.dashboard-stafl.de, Stand 13): wie bei der Verwaltung – startbar vor dem Konsolenschritt
      OIDC_SECRET_QS: ${OIDC_SECRET_QS:-noch-nicht-eingerichtet}
      OIDC_CRYPTO_QS: ${OIDC_CRYPTO_QS:-${OIDC_CRYPTO_ANGEBOT:?in .env setzen}}
      # Mitarbeiterkonten aus der Verwaltung (Stand 8, lib/anmeldekonten.php): Client „konten“ nur mit Service-Account; Keycloak im
      # internen Netz (nicht über Caddy). Ohne Geheimnis zeigt die Verwaltung „noch nicht eingerichtet“ – die Anwendung startet trotzdem
      OIDC_SECRET_KONTEN: ${OIDC_SECRET_KONTEN:-noch-nicht-eingerichtet}
      WA_KONTEN_URL: http://keycloak:8080
      # Alter Eingabebereich auf den Mitarbeiter-Hosts fest aus; nur der Notzugang (eigener Host auf Port 8090, apache-oidc.conf)
      # öffnet ihn – mit WA_NOTZUGANG=an in .env (sh deploy/notzugang.sh an|aus, erstellt diesen Container neu)
      WA_EIGENE_ANMELDUNG: "aus"
      WA_NOTZUGANG: ${WA_NOTZUGANG:-aus}
      # Schlüssel des im Eingabebereich hinterlegten Postfach-Passworts außerhalb des gemeinsamen Datenordners (ADR-007);
      # liegt er noch im Datenordner, gilt bis deploy/postfach-schluessel.sh umziehen der bisherige Ort
      WA_GEHEIM_DIR: /var/www/geheim
      # Interne Daten (ADR-007 Stufe 2): wirksam erst nach sh deploy/daten-trennen.sh trennen (Kennzeichen in daten/ und daten-intern/);
      # vorher liegt alles wie bisher in daten/
      WA_DATEN_INTERN: /var/www/daten-intern
    ports:
      # Notzugang (ADR-007 Regel 6): nur auf 127.0.0.1 des Servers – vom eigenen Rechner per SSH-Tunnel
      # (ssh -L 8190:127.0.0.1:8190 …, dann http://localhost:8190/admin/), wie die Keycloak-Verwaltung; nie über Caddy
      - "127.0.0.1:${NOTZUGANG_PORT:-8190}:8090"
    networks:
      intern:                                              # mit Caddy und Keycloak; nicht im Netz der Kundenseite

  postausgang:
    # Postausgang von innen (ADR-007, lib/postausgang.php, api/postausgang.php): verschickt Bestellwünsche, Benachrichtigungen und
    # Hinweise, die die Kundenseite nur als Auftrag ablegt. Ein Durchgang alle 5 Sekunden, jeder als eigener Prozess (hält keine
    # Sperre der Speicherschicht dauerhaft). Gleiches Image und gleicher Code wie app; kein Webserver, kein Port.
    image: stafl-app:${STAFL_APP_VERSION:-lokal}
    pull_policy: never
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    user: www-data
    command: ["sh", "-c", "trap 'exit 0' TERM INT; while :; do php /var/www/html/api/postausgang.php; sleep 5 & wait $$!; done"]
    healthcheck:
      test: ["CMD", "php", "/var/www/html/api/postausgang.php", "--pruefen"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./app:/var/www/html:ro
      - ./daten:/var/www/html/data
      - ./daten-geheim:/var/www/geheim:ro                 # Schlüssel des Postfach-Passworts (nur lesen; neu angelegt wird er in app-mitarbeiter)
      - ./daten-intern:/var/www/daten-intern              # interne Daten (Versandprotokoll, Benachrichtigungsstand) nach der Trennung
    environment:
      DOMAIN: ${DOMAIN}             # Adresse für Links in E-Mails
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_SECURE: ${MAIL_SMTP_SECURE:-starttls}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASS: ${MAIL_SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      WA_GEHEIM_DIR: /var/www/geheim
      WA_DATEN_INTERN: /var/www/daten-intern
      WA_EIGENE_ANMELDUNG: "aus"    # Links in Benachrichtigungen auf den Eingabebereich im Dashboard (wie app-mitarbeiter)
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    networks:
      postausgang:                                         # nur Ausgang ins Internet (Postfach); weder Caddy noch Keycloak noch die Apps

  caddy:
    networks:
      intern:                                              # zusätzlich zu default und edge: Ziele app-mitarbeiter und keycloak
      kunde:                                               # Ziel app (Kundenseite); Relais der Datenleck-Prüfung (Port 8081)

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    restart: unless-stopped
    logging:                        # Container-Protokoll begrenzt: höchstens 3 × 10 MB je Dienst (sonst wächst es unbegrenzt)
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    command: ["start", "--import-realm"]
    depends_on:
      - keycloak-db
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?in .env setzen}
      KC_HOSTNAME: https://login.dashboard-stafl.de
      # Verwaltungsoberfläche nur über einen SSH-Tunnel auf 127.0.0.1:8180 – nie über Caddy (ADR-003)
      KC_HOSTNAME_ADMIN: http://127.0.0.1:8180
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES_DISABLED: twitter-broker,identity-brokering-api
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx1024m"
      # Design der Anmeldeseite (deploy/anmeldung/theme): Änderungen aus einem Release wirken ohne Neustart von Keycloak, und
      # Browser holen Stylesheet und Skript spätestens nach einer Stunde neu (Standard wären 30 Tage)
      KC_SPI_THEME__CACHE_THEMES: "false"
      KC_SPI_THEME__CACHE_TEMPLATES: "false"
      KC_SPI_THEME__STATIC_MAX_AGE: "3600"
      # Tresor für Geheimnisse als Dateien (z. B. Postfach-Passwort: konten.sh mail-einrichten) – nicht in der Datenbank
      KC_VAULT: file
      KC_VAULT_DIR: /opt/keycloak/vault
    # Start-Konto (KC_BOOTSTRAP_ADMIN_*) nur während der Einrichtung: die Datei schreibt einrichten.sh, konten.sh verwaltung
    # löscht sie wieder. Fehlt sie, bekommt Keycloak die Variablen gar nicht (leer gesetzt bricht Keycloak 26.8 den Start ab).
    env_file:
      - path: ./daten-anmeldung/einrichtung.env
        required: false
    volumes:
      # Realm mit eingesetzten Geheimnissen (auf dem Server erzeugt, nicht im Repository – siehe LIESMICH)
      - ./daten-anmeldung/realm-import:/opt/keycloak/data/import:ro
      - ./daten-anmeldung/vault:/opt/keycloak/vault:ro      # nicht in den Sicherungen (wie mail-schluessel.php)
      # Anmeldeseite im Plattform-Design (aus dem Repository, nur lesend); aktiv erst mit konten.sh design-setzen
      - ./deploy/anmeldung/theme/stafl:/opt/keycloak/themes/stafl:ro
    ports:
      - "127.0.0.1:8180:8080"                              # nur lokal (SSH-Tunnel für die Verwaltung)
    networks:
      intern:                                              # Caddy (Anmeldeseite) und app-mitarbeiter (Konten); nie die Kundenseite
      anmeldung:

  keycloak-db:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: unless-stopped
    logging:                        # Container-Protokoll begrenzt: höchstens 3 × 10 MB je Dienst (sonst wächst es unbegrenzt)
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?in .env setzen}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --auth=scram-sha-256"
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    networks:
      anmeldung:                                           # eigene Datenbank und eigenes Netz, getrennt von den Geschäftsdaten

networks:
  # Mitarbeiterseite: Caddy, app-mitarbeiter und Keycloak (mit Ausgang ins Internet: Postfach, Keycloak-Metadaten über
  # login.dashboard-stafl.de). Die Kundenseite (app) ist nicht darin – ADR-007.
  intern:
  anmeldung:
    internal: true
  # Dienst postausgang allein: Ausgang zum Postfach (SMTP), sonst nichts
  postausgang:
  # Kundenseite (app) und Caddy – ohne Ausgang ins Internet (ADR-007, Härtung): eine übernommene Kundenseite kann weder
  # Werkzeuge nachladen noch Daten an fremde Server schicken. Einziger Weg nach außen: Caddy-Relais zu api.pwnedpasswords.com.
  kunde:
    internal: true

volumes:
  keycloak_db:
