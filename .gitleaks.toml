# Secret-Scan (gitleaks): Standardregeln plus Ausnahmen für feste Test-Passwörter der Ende-zu-Ende-Tests.
# Diese Passwörter gelten nur für die kurzlebigen Testserver der CI, nie für die Produktivseite.
[extend]
useDefault = true

[allowlist]
description = "Feste Test-Passwörter (tests/e2e)"
regexTarget = "match"
regexes = [
  '''Bearbeiter-Zugang-1''',
  '''Uebernahme-Versuch-1''',
  '''Gut-Passwort-2026''',
  '''Sicheres-Passwort-1''',
  '''Leserin-Zugang-1''',
  # Kunden-Zugänge (tests/e2e/test_kunden.py)
  '''Start-Kennwort-42''',
  '''Eigenes-Kennwort-55''',
  '''Neu-Gesetzt-Kennwort-9''',
  '''Editor-Zugang-77''',
  '''Seeblick-Eigen-202[67]''',
  '''x-gasthaus\.muster-1''',
  # E-Mail-Versand (tests/e2e/test_kunden_mail.py, Test-Mailserver)
  '''Test-Postfach-1''',
  '''Neues-Kennwort-66''',
  '''Admin-Gesetzt-77''',
  '''Kantine-Eigen-202[67]''',
  '''Konto-Passwort-9''',
  '''Falsches-Passwort-1''',
  # Platzhalter in .env.example
  '''hier-das-Postfach-Passwort''',
]
