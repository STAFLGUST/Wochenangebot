# Secret-Scan (gitleaks): Standardregeln plus Ausnahmen für feste Test-Passwörter der Ende-zu-Ende-Tests.
# Diese Passwörter gelten nur für die kurzlebigen Testserver der CI, nie für die Produktivseite.
[extend]
useDefault = true

[[allowlists]]
description = "Feste Test-Passwörter (tests/e2e)"
regexTarget = "match"
regexes = [
  '''Bearbeiter-Zugang-1''',
  '''Uebernahme-Versuch-1''',
  '''Gut-Passwort-2026''',
  '''Sicheres-Passwort-1''',
  '''Leserin-Zugang-1''',
  # Kunden-Zugänge (tests/e2e/test_kunden.py)
  '''Start-Kennwort-42''',
  '''Eigenes-Kennwort-55''',
  '''Neu-Gesetzt-Kennwort-9''',
  '''Editor-Zugang-77''',
  '''Seeblick-Eigen-202[67]''',
  '''x-gasthaus\.muster-1''',
  # E-Mail-Versand (tests/e2e/test_kunden_mail.py, Test-Mailserver)
  '''Test-Postfach-1''',
  '''Neues-Kennwort-66''',
  '''Admin-Gesetzt-77''',
  '''Kantine-Eigen-202[67]''',
  '''Konto-Passwort-9''',
  '''Falsches-Passwort-1''',
  '''Merk-Kennwort-31''',
  '''Weg-Kennwort-42''',
  '''Neu-Merk-Kennwort-7''',
  '''Kantine-Kennwort-5''',
  # Benachrichtigungen (tests/e2e/test_benachrichtigung.py)
  '''Max-Zugang-12345''',
  '''Zweiter-Zugang-4711''',
  '''Dritter-Zugang-4712''',
  # Nutzer anlegen und Zugangsdaten per E-Mail (tests/e2e/test_nutzer_anlegen.py)
  '''Erik-Kennwort-123''',
  '''Start-Kennwort-4711''',
  # HR · Verknüpfung Mitarbeiterkonto (tests/e2e/test_hr.py)
  '''Urlaub-Konto-4711''',
  '''irgendwas-langes-1''',   # Anmeldeversuch für einen Mitarbeiter ohne Anmeldung (Verlauf von PR #119)
  # Kunde mit Passwort bei abgelaufener Bestätigung (tests/oidc/test_oidc.py, Bestätigung im eigenen Fenster)
  '''Fenster-Kundenpasswort-7''',
  # Platzhalter in .env.example
  '''hier-das-Postfach-Passwort''',
]

[[allowlists]]
description = "Erfundene Passwörter nur in den zwei Admin-Bestätigungstests"
condition = "AND"
regexTarget = "secret"
paths = ['''^tests/e2e/test_admin_confirmation(_ui)?\.py$''']
regexes = ['''^(Leser-Geheimnis-123|Weiteres-Geheimnis-123|Replacement-Passwort-123|Falsch-Geheimnis-123)$''']

[[allowlists]]
description = "Prüfliste der Dateiprüfung: SHA-256-Prüfsummen der ausgelieferten Dateien (keine Geheimnisse; erzeugt von werkzeuge/integritaet.py)"
paths = [
  '''^app/api/lib/integritaet-liste\.php$''',
]

[[allowlists]]
description = "Keine Geheimnisse: Datenbankadresse (Host/Port/Name) der vorbereiteten Keycloak-Konfiguration; Passwörter nur in .env"
condition = "AND"
regexTarget = "line"
paths = ['''^deploy/anmeldung/docker-compose\.anmeldung\.yml$''']
regexes = ['''KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak''']
