# Wochenangebot – Start:  docker compose up -d
services:
  app:
    # Fest über Digest (gleiches Grundimage wie deploy/image/Dockerfile); aktualisieren: docs/entwickler/08-betrieb.md, „Images aktualisieren“
    image: php:8.3-apache@sha256:a800bbd2c0aa322702259ed475556b2cbc311076a8d3c4bba9bfe96838745472
    restart: unless-stopped
    logging:                        # Container-Protokoll begrenzt: höchstens 3 × 10 MB je Dienst (sonst wächst es unbegrenzt)
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    volumes:
      - ./app:/var/www/html:ro      # Website (nur lesend)
      - ./daten:/var/www/html/data  # gespeicherte Angebote, Entwurf, Versionen
    environment:
      WA_INSTALLED: "1"             # Ersteinrichtung im Browser gesperrt (Schutz bei leerem/defektem Datenordner)
      WA_TRUSTED_PROXIES: caddy     # Besucher-IP (X-Forwarded-For) nur vom eigenen Caddy übernehmen
      DOMAIN: ${DOMAIN}             # Adresse der Seite für Links in E-Mails
      # E-Mail-Versand (Werte nur in .env auf dem Server; leer = Versand ausgeschaltet)
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_SECURE: ${MAIL_SMTP_SECURE:-starttls}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASS: ${MAIL_SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}

  caddy:
    # Fest über Version und Digest (vorher „caddy:2“ – wechselte unbemerkt); aktualisieren: docs/entwickler/08-betrieb.md, „Images aktualisieren“
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: unless-stopped
    logging:                        # Container-Protokoll begrenzt: höchstens 3 × 10 MB je Dienst (sonst wächst es unbegrenzt)
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ALLOWED_IPS: ${ALLOWED_IPS:-0.0.0.0/0}
      # bunny.net vor dem Server (Caddyfile, Abschnitt „cdn“; docs/bunny-cdn.md) – leer = wie bisher ohne CDN
      CDN_SCHLUESSEL: ${CDN_SCHLUESSEL:-}
      CDN_PFLICHT: ${CDN_PFLICHT:-0}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data            # HTTPS-Zertifikate
      - caddy_config:/config
    networks:
      default:
      edge:                         # nur Caddy ↔ Testumgebung (test.<Domain>); die App des Echtbetriebs ist dort nicht erreichbar
        aliases: [wa-caddy]

networks:
  edge:
    name: wochenangebot-edge

volumes:
  caddy_data:
  caddy_config:
