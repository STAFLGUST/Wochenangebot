# Testumgebung „Anmeldung über Keycloak“ (Roadmap 7b, nur CI und lokal – GR-111). Apache mit mod_auth_openidc
# (OpenID-zertifizierter Client, Entscheidung zu ADR-003) vor der unveränderten Anwendung. Werte kommen aus der Umgebung
# (tests/oidc/umgebung.sh); Geheimnisse werden bei jedem Start neu erzeugt und nie gespeichert.
ServerRoot "${OIDC_WORK}/apache"
PidFile "${OIDC_WORK}/apache/httpd.pid"
Listen 127.0.0.1:${APACHE_PORT}
ServerName localhost
Mutex file:${OIDC_WORK}/apache
<IfDefine ALS_ROOT>
	User www-data
	Group www-data
</IfDefine>

LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule authz_user_module /usr/lib/apache2/modules/mod_authz_user.so
LoadModule authn_core_module /usr/lib/apache2/modules/mod_authn_core.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule env_module /usr/lib/apache2/modules/mod_env.so
LoadModule setenvif_module /usr/lib/apache2/modules/mod_setenvif.so
LoadModule alias_module /usr/lib/apache2/modules/mod_alias.so
LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so
LoadModule auth_openidc_module /usr/lib/apache2/modules/mod_auth_openidc.so
LoadModule php_module /usr/lib/apache2/modules/libphp8.3.so

ErrorLog "${OIDC_WORK}/apache/error.log"
LogLevel warn auth_openidc:info
LogFormat "%h %{Host}i \"%r\" %>s %{OIDC_CLAIM_preferred_username}e" kurz
CustomLog "${OIDC_WORK}/apache/access.log" kurz
TypesConfig /etc/mime.types
DirectoryIndex index.html index.php
<FilesMatch "\.php$">
	SetHandler application/x-httpd-php
</FilesMatch>
php_value session.save_path "${OIDC_WORK}/sessions"
php_flag display_errors off
php_flag log_errors on
php_value error_log "${OIDC_WORK}/apache/php.log"
# Testlauf ohne echten Mailserver, Datenleck-Prüfung aus (wie tests/run_e2e.py)
SetEnv WA_TRUSTED_PROXIES 127.0.0.1

DocumentRoot "${OIDC_WORK}/app"
<Directory "${OIDC_WORK}/app">
	Options -Indexes
	AllowOverride All
	Require all granted
</Directory>

# Gemeinsame Einstellungen der Keycloak-Anbindung; je Host ein eigener Client, eigenes Geheimnis, eigene Sitzung
Define OIDC_ISSUER https://login.stafl.test:${OIDC_PORT}/realms/mitarbeiter
OIDCProviderMetadataURL ${OIDC_ISSUER}/.well-known/openid-configuration
OIDCCABundlePath "${OIDC_WORK}/caddy/pki/authorities/local/root.crt"
OIDCSSLValidateServer On
OIDCResponseType code
OIDCPKCEMethod S256
OIDCScope "openid"
OIDCProviderTokenEndpointAuth client_secret_basic
OIDCCacheType shm
OIDCSessionType server-cache
OIDCSessionInactivityTimeout 14400
OIDCSessionMaxDuration 36000
OIDCCookieSameSite On
OIDCCookieHTTPOnly On
OIDCStateCookiePrefix "__Host-oidc_state_"
OIDCXForwardedHeaders X-Forwarded-Proto
OIDCRemoteUserClaim sub
OIDCPassClaimsAs environment
OIDCClaimPrefix OIDC_CLAIM_
OIDCPassIDTokenAs claims
OIDCPassRefreshToken Off
OIDCPassAccessToken Off
OIDCAuthNHeader X-Nie-Verwendet
OIDCRedirectURLsAllowed ^https://(dashboard|angebot|verwaltung)\.stafl\.test:${OIDC_PORT}/([^/]|$)

# Ohne Keycloak (wie heute angebot-stafl.de): nur für die Testvorbereitung (Mitarbeiterkonten anlegen)
<VirtualHost 127.0.0.1:${APACHE_PORT}>
	ServerName legacy.stafl.test
</VirtualHost>

<VirtualHost 127.0.0.1:${APACHE_PORT}>
	ServerName https://dashboard.stafl.test:${OIDC_PORT}
	SetEnv WA_OIDC 1
	SetEnv WA_OIDC_ISSUER ${OIDC_ISSUER}
	SetEnv WA_OIDC_ACR mfa
	SetEnv WA_OBERFLAECHE dashboard.start
	OIDCClientID dashboard
	OIDCCryptoPassphrase "${OIDC_CRYPTO_DASHBOARD}"
	OIDCClientSecret "${OIDC_SECRET_DASHBOARD}"
	OIDCRedirectURI https://dashboard.stafl.test:${OIDC_PORT}/oidc/callback
	OIDCCookie "__Host-oidc_sitzung"
	OIDCDefaultLoggedOutURL https://dashboard.stafl.test:${OIDC_PORT}/dashboard/abgemeldet.html
	RedirectMatch 302 ^/$ /dashboard/
	<Location />
		AuthType openid-connect
		Require valid-user
	</Location>
	<Location /api/>
		AuthType openid-connect
		OIDCUnAuthAction 401
		Require valid-user
	</Location>
	<LocationMatch "^/(dashboard/abgemeldet\.html|dashboard/dashboard\.css|assets/)">
		AuthType None
		Require all granted
	</LocationMatch>
</VirtualHost>

<VirtualHost 127.0.0.1:${APACHE_PORT}>
	ServerName https://angebot.stafl.test:${OIDC_PORT}
	SetEnv WA_OIDC 1
	SetEnv WA_OIDC_ISSUER ${OIDC_ISSUER}
	SetEnv WA_OIDC_ACR mfa
	SetEnv WA_OBERFLAECHE angebot.eingabe
	OIDCClientID angebot
	OIDCCryptoPassphrase "${OIDC_CRYPTO_ANGEBOT}"
	OIDCClientSecret "${OIDC_SECRET_ANGEBOT}"
	OIDCRedirectURI https://angebot.stafl.test:${OIDC_PORT}/oidc/callback
	OIDCCookie "__Host-oidc_sitzung"
	OIDCDefaultLoggedOutURL https://angebot.stafl.test:${OIDC_PORT}/dashboard/abgemeldet.html
	RedirectMatch 302 ^/$ /admin/
	<Location />
		AuthType openid-connect
		Require valid-user
	</Location>
	<Location /api/>
		AuthType openid-connect
		OIDCUnAuthAction 401
		Require valid-user
	</Location>
	<LocationMatch "^/(dashboard/abgemeldet\.html|dashboard/dashboard\.css|assets/)">
		AuthType None
		Require all granted
	</LocationMatch>
</VirtualHost>

<VirtualHost 127.0.0.1:${APACHE_PORT}>
	ServerName https://verwaltung.stafl.test:${OIDC_PORT}
	SetEnv WA_OIDC 1
	SetEnv WA_OIDC_ISSUER ${OIDC_ISSUER}
	SetEnv WA_OIDC_ACR mfa
	SetEnv WA_OBERFLAECHE verwaltung.verwaltung
	OIDCClientID verwaltung
	OIDCCryptoPassphrase "${OIDC_CRYPTO_VERWALTUNG}"
	OIDCClientSecret "${OIDC_SECRET_VERWALTUNG}"
	OIDCRedirectURI https://verwaltung.stafl.test:${OIDC_PORT}/oidc/callback
	OIDCCookie "__Host-oidc_sitzung"
	OIDCDefaultLoggedOutURL https://verwaltung.stafl.test:${OIDC_PORT}/dashboard/abgemeldet.html
	RedirectMatch 302 ^/$ /admin/
	<Location />
		AuthType openid-connect
		Require valid-user
	</Location>
	<Location /api/>
		AuthType openid-connect
		OIDCUnAuthAction 401
		Require valid-user
	</Location>
	<LocationMatch "^/(dashboard/abgemeldet\.html|dashboard/dashboard\.css|assets/)">
		AuthType None
		Require all granted
	</LocationMatch>
</VirtualHost>
