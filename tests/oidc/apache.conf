<VirtualHost 127.0.0.1:${APACHE_PORT}>
	ServerName https://verwaltung.stafl.test:${OIDC_PORT}
	SetEnv WA_OIDC 1
	SetEnv WA_OIDC_ISSUER ${OIDC_ISSUER}
	SetEnv WA_OIDC_ACR mfa
	SetEnv WA_OBERFLAECHE verwaltung.verwaltung
	SetEnv WA_DASHBOARD https://dashboard.stafl.test:${OIDC_PORT}/
	OIDCClientID verwaltung
	OIDCCryptoPassphrase "${OIDC_CRYPTO_VERWALTUNG}"
	OIDCClientSecret "${OIDC_SECRET_VERWALTUNG}"
	OIDCRedirectURI https://verwaltung.stafl.test:${OIDC_PORT}/oidc/callback
	OIDCCookie "__Host-oidc_sitzung"
	OIDCDefaultLoggedOutURL https://verwaltung.stafl.test:${OIDC_PORT}/dashboard/abgemeldet.html
	OIDCDefaultURL https://verwaltung.stafl.test:${OIDC_PORT}/
	Alias /karte/karte.pmtiles "${OIDC_WORK}/karte/karte.pmtiles"
	RedirectMatch 302 ^/$ /admin/
	# Importzentrale (Kachel „Import“, verwaltung.import): derselbe Eingabebereich, nur mit der Ansicht „importe“ (nur=import).
	# Als Parameter statt #importe, damit die Ansicht auch eine erstmalige Anmeldung bei Keycloak übersteht
	RedirectMatch 302 ^/import/?$ /admin/?ansicht=importe&nur=import
	<Location />
		AuthType openid-connect
		Require valid-user
	</Location>
	<Location /api/>
		AuthType openid-connect
		OIDCUnAuthAction 401
		Require valid-user
	</Location>
	<LocationMatch "^/(dashboard/abgemeldet\.html|dashboard/dashboard\.css|assets/)">
		AuthType None
		Require all granted
	</LocationMatch>
</VirtualHost>

