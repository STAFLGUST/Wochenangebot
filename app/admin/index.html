<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Wochenangebot · Eingabebereich</title>
<script>try{var t=localStorage.getItem("wochenangebot.theme");if(t){t=JSON.parse(t);if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}}catch(e){}</script>
<link rel="stylesheet" href="../assets/app.css?v=20261016d">
<link rel="stylesheet" href="../assets/admin.css?v=20261016d">
</head>
<body class="adm">

<!-- Anmeldung / Ersteinrichtung -->
<main class="auth" id="screen-auth" hidden>
  <form class="auth-card" id="auth-form" autocomplete="on">
    <div class="brand"><div class="brand-mark" aria-hidden="true">W</div><div><div class="brand-company" data-company></div><h1>Eingabebereich</h1></div></div>
    <p class="auth-intro" id="auth-intro"></p>
    <label class="fld"><span>Passwort</span><input type="password" id="pw1" autocomplete="current-password" required minlength="1"></label>
    <label class="fld" id="pw2-wrap" hidden><span>Passwort wiederholen</span><input type="password" id="pw2" autocomplete="new-password"></label>
    <p class="form-err" id="auth-err" role="alert"></p>
    <button class="btn primary wide" type="submit" id="auth-submit">Anmelden</button>
    <a class="auth-back" href="../">Zur öffentlichen Angebotsseite</a>
  </form>
</main>

<!-- Editor -->
<div id="screen-editor" hidden>
  <header class="topbar" id="topbar">
    <div class="topbar-inner adm-top">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">W</div>
        <div><div class="brand-company" data-company></div><h1>Eingabebereich</h1></div>
      </div>
      <div class="save-state" id="save-state" role="status" aria-live="polite"></div>
      <div class="actions">
        <button class="btn ghost" type="button" id="btn-undo" disabled title="Letzte Änderung rückgängig (Strg+Z)"><svg class="i" aria-hidden="true"><use href="#i-undo"/></svg><span class="lbl">Rückgängig</span></button>
        <button class="btn ghost" type="button" id="btn-import"><svg class="i" aria-hidden="true"><use href="#i-upload"/></svg><span class="lbl">Excel importieren</span></button>
        <button class="btn ghost" type="button" id="btn-preview"><svg class="i" aria-hidden="true"><use href="#i-eye"/></svg><span class="lbl">Vorschau</span></button>
        <button class="btn primary" type="button" id="btn-publish"><svg class="i" aria-hidden="true"><use href="#i-send"/></svg><span class="lbl">Veröffentlichen</span></button>
        <div class="menu-wrap">
          <button class="btn icon ghost" id="btn-more" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Weitere Aktionen"><svg class="i" aria-hidden="true"><use href="#i-more"/></svg></button>
          <div class="menu" id="menu-more" role="menu" hidden>
            <button role="menuitem" type="button" data-act="versions"><svg class="i" aria-hidden="true"><use href="#i-history"/></svg>Frühere Veröffentlichungen</button>
            <button role="menuitem" type="button" data-act="discard"><svg class="i" aria-hidden="true"><use href="#i-undo"/></svg>Entwurf verwerfen</button>
            <hr>
            <button role="menuitem" type="button" data-act="open-site"><svg class="i" aria-hidden="true"><use href="#i-link"/></svg>Öffentliche Seite öffnen</button>
            <button role="menuitem" type="button" data-act="password"><svg class="i" aria-hidden="true"><use href="#i-key"/></svg>Passwort ändern</button>
            <button role="menuitem" type="button" data-act="theme"><svg class="i" aria-hidden="true"><use href="#i-moon"/></svg>Hell / Dunkel</button>
            <hr>
            <button role="menuitem" type="button" data-act="logout"><svg class="i" aria-hidden="true"><use href="#i-logout"/></svg>Abmelden</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="page adm-page">
    <div class="tabs view-tabs" role="tablist" aria-label="Bereich wählen">
      <button role="tab" type="button" id="vt-edit" aria-selected="true" aria-controls="view-edit">Angebot bearbeiten</button>
      <button role="tab" type="button" id="vt-hist" aria-selected="false" aria-controls="view-hist">Preisverlauf</button>
    </div>
    <div id="view-edit">
    <section class="meta-card" aria-label="Angebotsdaten">
      <label class="fld sm"><span>Kalenderwoche</span><input type="number" id="m-week" min="1" max="53" inputmode="numeric"></label>
      <label class="fld sm"><span>Jahr</span><input type="number" id="m-year" min="2000" max="2100" inputmode="numeric"></label>
      <label class="fld grow"><span>Hinweis zum Angebot</span><input type="text" id="m-notice" maxlength="120" placeholder="z. B. Freibleibendes Angebot"></label>
      <div class="meta-info" id="m-info"></div>
    </section>

    <section class="changes" id="changes" aria-live="polite"></section>

    <div class="ed-toolbar">
      <div class="search">
        <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="ed-q" type="search" autocomplete="off" placeholder="Artikel finden: Nummer, Bezeichnung, Herkunft …" aria-label="Artikel im Entwurf suchen">
      </div>
      <label class="check"><input type="checkbox" id="only-changes"> Nur Änderungen</label>
      <span class="ed-hint">Preis: Zahl (23,30) · „a. Anfr.“ · leer = ohne Preis</span>
      <button class="btn" type="button" id="btn-add-group"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>Gruppe</button>
    </div>

    <div id="groups"></div>
    </div>
    <div id="view-hist" hidden></div>
  </main>
</div>

<!-- Artikel-Details -->
<dialog class="modal" id="dlg-item" aria-labelledby="it-title"><form class="dlg" method="dialog" id="item-body"></form></dialog>
<!-- Import -->
<dialog class="modal" id="dlg-import" aria-labelledby="imp-title"><div class="dlg" id="import-body"></div></dialog>
<!-- Veröffentlichen -->
<dialog class="modal wide" id="dlg-publish" aria-labelledby="pub-title"><div class="dlg" id="publish-body"></div></dialog>
<!-- Versionen -->
<dialog class="modal" id="dlg-versions" aria-labelledby="ver-title"><div class="dlg" id="versions-body"></div></dialog>
<!-- Passwort -->
<dialog class="modal" id="dlg-password" aria-labelledby="pw-title">
  <form class="dlg" id="pw-form">
    <div class="dlg-head"><div><h2 id="pw-title">Passwort ändern</h2><p>Mindestens 10 Zeichen.</p></div><button class="btn icon ghost" type="button" data-close aria-label="Schließen"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
    <div class="dlg-body form-grid">
      <label class="fld"><span>Bisheriges Passwort</span><input type="password" name="current" autocomplete="current-password" required></label>
      <label class="fld"><span>Neues Passwort</span><input type="password" name="password" autocomplete="new-password" minlength="10" required></label>
      <label class="fld"><span>Neues Passwort wiederholen</span><input type="password" name="password2" autocomplete="new-password" minlength="10" required></label>
      <p class="form-err" id="pw-err" role="alert"></p>
    </div>
    <div class="dlg-foot"><button class="btn" type="button" data-close>Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div>
  </form>
</dialog>
<!-- Preisverlauf: Artikel -->
<dialog class="modal wide" id="dlg-series" aria-labelledby="ser-title"><div class="dlg" id="series-body"></div></dialog>
<!-- Preisverlauf: alte Angebote hochladen -->
<dialog class="modal wide" id="dlg-hist-import" aria-labelledby="hi-title"><div class="dlg" id="hist-import-body"></div></dialog>
<!-- Bestätigung -->
<dialog class="modal" id="dlg-confirm" aria-labelledby="cf-title"><div class="dlg" id="confirm-body"></div></dialog>

<input type="file" id="hist-file-input" multiple accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<input type="file" id="file-input" accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<datalist id="dl-origins"></datalist>
<datalist id="dl-sections"></datalist>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7 8.5 12 4l5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></g></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.1"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l.9 12.5a1.5 1.5 0 0 0 1.5 1.5h6.2a1.5 1.5 0 0 0 1.5-1.5L17.5 7M9.5 7V4.5h5V7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 9h11a5 5 0 0 1 0 10H8"/><path d="M8 5 4 9l4 4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m6.5 14.5 5.5-5.5 5.5 5.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="12" cy="5.5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="18.5" r="1.3"/></g></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 4.5V9H8M12 7.5V12l3 2"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.5M16 7l2.5 2.5M14 9l2 2"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H14M10 12h10M16.5 8.5 20 12l-3.5 3.5"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19.5h16M6.5 15l4-4.5 3 3L19 7"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5v-2a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
</svg>

<script src="../assets/offer-core.js?v=20261016d"></script>
<script src="../assets/admin.js?v=20261016d"></script>
</body>
</html>
