<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>STAFL-Plattform · Sicherheit</title>
<link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<script src="../../assets/theme.js"></script>
<link rel="stylesheet" href="../../assets/app.css">
<link rel="stylesheet" href="sicherheit.css">
</head>
<body class="sic">
<div class="sic-bg" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="sic-seite">
  <header class="sic-kopf sic-glas">
    <a class="stafl-zurueck" id="sic-zurueck" href="../../dashboard/" title="Zurück zum Dashboard" aria-label="Zurück zum Dashboard"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg><span class="lbl">Dashboard</span></a>
    <span class="sic-marke"><img class="brand-logo" src="../../assets/logo-standard-fleisch-kopf.png" width="428" height="96" alt="Standard-Fleisch"></span>
    <span class="sic-modul"><svg class="i" aria-hidden="true"><use href="#i-schild"/></svg>Sicherheit<span class="sic-modul-zusatz">· Leitstand</span></span>
    <div class="sic-aktionen">
      <span class="sic-lage-pille" id="sic-lage-pille" hidden></span>
      <span class="sic-uhr num" id="sic-uhr" aria-hidden="true"></span>
      <button class="sic-rund" id="sic-neu" type="button" aria-label="Neu laden" title="Neu laden"><svg class="i" aria-hidden="true"><use href="#i-neu"/></svg></button>
      <button class="sic-rund" id="sic-theme" type="button" aria-label="Dunkles Design einschalten" title="Hell / Dunkel"><svg class="i" aria-hidden="true"><use href="#i-moon"/></svg></button>
      <span class="sic-user" id="sic-user" hidden><span class="sic-initialen" id="sic-initialen" aria-hidden="true"></span><span class="sr-only">Angemeldet als </span><span class="sic-user-name" id="sic-user-name"></span></span>
    </div>
  </header>

  <main class="sic-main">
    <section class="sic-hinweisbox sic-glas" id="sic-login" hidden>
      <svg class="i" aria-hidden="true"><use href="#i-lock"/></svg>
      <h1>Bitte anmelden</h1>
      <p>Die Sicherheitszentrale steht nach der Anmeldung als Administrator oder mit einer Sicherheitsberechtigung zur Verfügung.</p>
      <a class="btn primary" href="../../admin/">Zur Anmeldung</a>
    </section>
    <p class="sic-fehler" id="sic-err" role="alert" hidden></p>

    <section id="sic-app" hidden>
      <div class="sic-notfallband" id="sic-notfallband" role="status" hidden></div>
      <div class="sic-probeband" id="sic-probeband" role="status" hidden></div>
      <nav class="sic-tabs stafl-streifen" id="sic-tabs" role="tablist" aria-label="Bereiche">
        <button type="button" role="tab" data-tab="lage" aria-selected="false" hidden>Lagebild</button>
        <button type="button" role="tab" data-tab="notfall" aria-selected="false">Notfall</button>
        <button type="button" role="tab" data-tab="firewall" aria-selected="false" hidden>Firewall &amp; Sperren</button>
        <button type="button" role="tab" data-tab="sitzungen" aria-selected="false" hidden>Anmeldung &amp; Sitzungen</button>
        <button type="button" role="tab" data-tab="datei" aria-selected="false" hidden>Dateiprüfung</button>
        <button type="button" role="tab" data-tab="ereignisse" aria-selected="false" hidden>Ereignisse</button>
        <button type="button" role="tab" data-tab="einstellungen" aria-selected="false" hidden>Einstellungen &amp; Vorlagen</button>
        <button type="button" role="tab" data-tab="konten" aria-selected="false" hidden>Konten</button>
      </nav>
      <div class="sic-tab" id="tab-lage" role="tabpanel" hidden></div>
      <div class="sic-tab" id="tab-notfall" role="tabpanel" hidden></div>
      <div class="sic-tab" id="tab-firewall" role="tabpanel" hidden></div>
      <div class="sic-tab" id="tab-sitzungen" role="tabpanel" hidden></div>
      <div class="sic-tab" id="tab-datei" role="tabpanel" hidden></div>
      <div class="sic-tab" id="tab-ereignisse" role="tabpanel" hidden></div>
      <div class="sic-tab" id="tab-einstellungen" role="tabpanel" hidden></div>
      <div class="sic-tab" id="tab-konten" role="tabpanel" hidden></div>
    </section>
  </main>
  <footer class="sic-fuss">STAFL-Plattform · Standard-Fleisch · Sicherheitszentrale</footer>
</div>

<!-- Ein Dialog für Details, Bearbeiten und Bestätigungen (nie verschachtelt; Inhalt je Vorgang, auf dem Handy als Blatt von unten) -->
<dialog class="sic-dialog" id="sic-dlg" aria-labelledby="sic-dlg-titel"></dialog>

<div class="sic-toast" id="sic-toast" role="status" aria-live="polite"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-back" viewBox="0 0 24 24"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></symbol>

  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>

  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

  <symbol id="i-neu" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4.5V11h-6.5"/></symbol>
  <symbol id="i-alarm" viewBox="0 0 24 24"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 10v4.2"/><circle cx="12" cy="16.9" r=".9" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-kunden" viewBox="0 0 24 24"><path d="M4 9.5 5.5 5h13L20 9.5M4 9.5h16v10H4zM9 19.5v-5h6v5"/></symbol>
  <symbol id="i-team" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19.5c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9.5" r="2.4"/><path d="M15.5 14.7c2.3-.4 4.3.9 5 4.8"/></symbol>

  <symbol id="i-wand" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M3.5 14.5h17M9 4.5v5M15 9.5v5M9 14.5v5"/></symbol>

  <symbol id="i-liste" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.8" cy="6.5" r="1" fill="currentColor" stroke="none"/><circle cx="4.8" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4.8" cy="17.5" r="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.8 3.6-6 7-6s6.2 2.2 7 6"/></symbol>
  <symbol id="i-uebung" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V10M9.5 3.5h5M12 3.5v3M18.2 7.3l1.3-1.3"/></symbol>
  <symbol id="i-telefon" viewBox="0 0 24 24"><path d="M6.5 3.5h3l1.5 4-2 1.3a10.5 10.5 0 0 0 6.2 6.2l1.3-2 4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.7a2 2 0 0 1 2-2.2z"/></symbol>
  <symbol id="i-bericht" viewBox="0 0 24 24"><path d="M6.5 3.5h7l4 4v13h-11z"/><path d="M13.5 3.5v4h4M9.5 17v-3M12 17v-5.5M14.5 17v-2"/></symbol>
  <symbol id="i-stift" viewBox="0 0 24 24"><path d="M4.5 19.5 5.3 16 15.8 5.5a2 2 0 0 1 2.7 2.7L8 18.7z"/><path d="m14 7.3 2.7 2.7"/></symbol>
  <symbol id="i-hoch" viewBox="0 0 24 24"><path d="m6 14.5 6-6 6 6"/></symbol>
  <symbol id="i-extern" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>

<script src="sicherheit.js"></script>
</body>
</html>
