# Herkunftsanker der Fremddateien in app/assets/vendor/
#
# Je Datei: Name, Fassung, Bezugsquelle (Adresse des offiziellen Pakets) und die Prüfsumme der Datei, wie sie hier im
# Repository liegt. Die Dateiprüfung (app/api/lib/integritaet.php) nimmt Name und Fassung von hier – ein Fassungsmuster im
# Dateikopf ist nur noch Rückfall für Dateien ohne Eintrag und lieferte für pdf.js „2.0“ aus dem Lizenztext.
# `python3 werkzeuge/regeln.py pruefen` verlangt für jede Datei unter app/assets/vendor/ einen Eintrag und vergleicht sha256.
#
# OFFEN (Inhaber): `sha256_quelle` ist noch leer – der Abgleich der Prüfsummen gegen die veröffentlichten Pakete steht aus.
# Er braucht Netzzugang und gehört nicht in einen Agentenlauf. Bis dahin sichert `sha256` nur, dass sich die Datei im
# Repository nicht unbemerkt ändert; dass sie der Veröffentlichung entspricht, ist damit noch nicht belegt.
#
# Neue Fremddatei: Eintrag hier ergänzen (Pfad relativ zu diesem Ordner), `sha256sum` der Datei eintragen.

