# Automatische Prüfungen für jeden Pull Request und jeden Commit auf main.
# Ein Release (release.yml) ist nur für einen Commit möglich, für den dieser Workflow erfolgreich war.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  TRIVY_VERSION: "0.76.0"
  TRIVY_SHA256: "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7"

jobs:
  statisch:
    name: Statische Prüfungen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: PHP-Syntax
        run: |
          php --version | head -1
          find app deploy -name '*.php' ! -path 'app/api/geo/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript-Syntax
        run: for f in app/assets/*.js app/assets/vendor/*.js tests/unit/*.js; do node --check "$f"; done
      - name: Shell-Skripte (shellcheck)
        run: shellcheck --severity=warning deploy/*.sh tests/deploy/*.sh
      - name: Caddy-Konfiguration mit echtem Parser prüfen
        run: |
          docker run --rm --network none \
            -e DOMAIN=angebot-stafl.de \
            -e ALLOWED_IPS=0.0.0.0/0 \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - name: Dashboard-Domains nur als geschützte Platzhalter
        run: python3 tests/deploy/test_dashboard_domains.py
      - name: Python-Syntax
        run: python3 -m py_compile tests/run_e2e.py tests/e2e/*.py werkzeuge/*.py deploy/*.py
      - name: Versionsnummern der Skripte und Stylesheets
        run: python3 werkzeuge/asset_versionen.py
      - name: Prüfliste der Dateiprüfung (app/api/lib/integritaet-liste.php)
        run: python3 werkzeuge/integritaet.py
      - name: Tests ohne fest eingetragene Ports (parallele Testläufe)
        run: |
          if grep -rnE "127\.0\.0\.1:[0-9]{4}" tests/e2e --include=*.py | grep -v "tests/e2e/umgebung.py"; then
            echo "::error::Ports/Adressen in Tests bitte über tests/e2e/umgebung.py (BASE, SMTP_PORT, …) beziehen."; exit 1
          fi
      - name: Unit-Test Bestands-Parser
        run: node tests/unit/bestand_parser.test.js
      - name: Unit-Tests exakte Bestandswochen und Preisvergleich
        run: |
          php tests/unit/stock_prices.php
          node tests/unit/stock_prices.test.js
      - name: Unit-Test gemeinsames Bearbeiten (Abgleich)
        run: node tests/unit/merge.test.js
      - name: Workflows prüfen (actionlint)
        run: |
          curl -sSLf -o /tmp/al.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/al.tgz" | sha256sum -c -
          tar xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint -color

  sicherheit:
    name: Sicherheitsprüfungen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret-Scan über den gesamten Verlauf (gitleaks)
        run: |
          curl -sSLf -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gl.tgz" | sha256sum -c -
          tar xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner
      - name: Trivy installieren
        run: |
          curl -sSLf -o /tmp/tv.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/tv.tgz" | sha256sum -c -
          tar xzf /tmp/tv.tgz -C /tmp trivy
      - name: Python-Testabhängigkeiten auf bekannte Lücken prüfen
        run: /tmp/trivy fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL tests/requirements.txt
      - name: Container-Images auf bekannte Lücken prüfen (Bericht)
        run: |
          grep -E '^\s*image:' docker-compose.yml | awk '{print $2}' | while read -r img; do
            echo "::group::$img"
            /tmp/trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$img"
            echo "::endgroup::"
          done

  betrieb:
    name: Sicherung und Release-Prozess
    needs: statisch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Datenbankmigration, Parallelzugriffe und Wiederherstellung
        run: python3 tests/deploy/test_datenbank.py
      - name: Datenbankschutz im PHP-Container
        run: sh tests/deploy/test_sqlite_http.sh
      - name: Datensicherung (deploy/sichern.sh)
        run: sh tests/deploy/test_sichern.sh
      - name: Release-Modus mit Healthcheck und Rückfall (deploy/freigabe-einspielen.sh)
        run: sh tests/deploy/test_freigabe.sh
      - name: Testumgebung verwalten (mit Platzhaltern für docker/git)
        run: sh tests/deploy/test_testumgebung.sh
      - name: Prüfungen des Release-Laufs (mit Platzhalter für gh)
        run: sh tests/deploy/test_release_pruefen.sh

  e2e:
    strategy:
      fail-fast: false
      matrix:
        storage: [files, sqlite]
    name: Ende-zu-Ende-Tests (${{ matrix.storage }})
    env:
      WA_TEST_STORAGE: ${{ matrix.storage }}
    needs: statisch
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Testumgebung einrichten
        run: |
          php --version | head -1
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Alle Testgruppen gegen frische Testserver (4 Gruppen parallel)
        env:
          WA_JOBS: "4"
        run: python tests/run_e2e.py
      - name: Protokolle und Bildschirmfotos bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-ergebnisse-${{ matrix.storage }}
          path: |
            tests/.ergebnisse/
            tests/.arbeit/*.log
          retention-days: 7

  e2e_required:
    # Stable required-check name: preserve existing branch protection with the new matrix.
    name: Ende-zu-Ende-Tests
    needs: e2e
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Beide Speicherarten erfolgreich
        env:
          RESULT: ${{ needs.e2e.result }}
        run: test "$RESULT" = success

  release_vorlegen:
    # Nach erfolgreicher CI auf main: Release-Lauf starten. Er wartet auf die Freigabe in der Umgebung
    # „produktion“ (release.yml); ohne Freigabe geht nichts live.
    name: Release zur Freigabe vorlegen
    needs: [statisch, sicherheit, betrieb, e2e_required]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write   # Release-Lauf starten
    steps:
      - name: Release-Lauf starten (wartet auf Freigabe)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          NACHRICHT: ${{ github.event.head_commit.message }}
        run: |
          zeile1=$(printf '%s\n' "${NACHRICHT}" | sed -n 1p)
          titel=$(printf '%s\n' "${NACHRICHT}" | sed -n '3,$p' | sed '/^$/d' | head -1)
          case "${zeile1}" in
            "Merge pull request #"*) nr=$(printf '%s' "${zeile1}" | sed -E 's/^Merge pull request (#[0-9]+).*/\1/'); grund="PR ${nr}: ${titel:-${zeile1}}" ;;
            *) grund="${zeile1}" ;;
          esac
          grund=$(printf '%.200s' "${grund}")
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref main -f grund="${grund}" -f sha="${SHA}"
          {
            echo "### Release zur Freigabe vorgelegt: \`${SHA:0:7}\`"
            echo "Grund: ${grund}"
            echo "Freigeben: Actions → Release → wartender Lauf → Review deployments → Approve and deploy."
          } >> "${GITHUB_STEP_SUMMARY}"
