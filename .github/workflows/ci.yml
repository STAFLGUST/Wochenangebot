# Automatische Prüfungen für jeden Pull Request und jeden Commit auf main.
# Ein Release (release.yml) ist nur für einen Commit möglich, für den dieser Workflow erfolgreich war.
# Keine Doppelprüfung nach dem Merge: Hat ein Pull-Request-Lauf genau denselben Inhalt (Git-Tree) vollständig und
# erfolgreich geprüft, überspringt der Lauf auf main die schweren Aufträge und legt den Release sofort vor
# (Auftrag „nachweis“, .github/scripts/ci_nachweis.py, docs/release-freigabe.md). Sonst volle CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pull Requests: ein neuer Push bricht den veralteten Lauf ab (spart Zeit).
# main: nie abbrechen – sonst kann ein verspäteter oder zusätzlich gestarteter Lauf den Lauf beenden, der den Release
# zur Freigabe vorlegt (so geschehen am 21.10.2026). Weitere Läufe warten, bis der laufende fertig ist.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  TRIVY_VERSION: "0.76.0"
  TRIVY_SHA256: "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7"

jobs:
  nachweis:
    # Pull Request: hält den geprüften Stand (Tree) fest; er erscheint am Ende im Namen von „Vollständig geprüft (…)“.
    # main (push): sucht einen erfolgreichen, vollständigen Pull-Request-Lauf mit genau diesem Tree (nur Vergleich von
    # Hashes über die API, keine fremden Dateien). Gefunden → uebernommen=true; jeder Zweifel → volle CI.
    name: Schon im Pull Request geprüft?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read         # CI-Läufe und Aufträge der Pull Requests lesen
      pull-requests: read   # Pull Request zum main-Commit (Squash/Rebase)
    outputs:
      tree: ${{ steps.stand.outputs.tree }}
      uebernommen: ${{ steps.suche.outputs.uebernommen }}
      lauf: ${{ steps.suche.outputs.lauf }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Geprüfter Stand (Git-Tree)
        id: stand
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=${tree}" >> "${GITHUB_OUTPUT}"
          echo "Geprüfter Stand: Commit ${GITHUB_SHA}, Tree ${tree}"
      - name: Vollständig geprüften Pull-Request-Lauf mit gleichem Stand suchen (nur main)
        id: suche
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TREE: ${{ steps.stand.outputs.tree }}
        run: python3 -I .github/scripts/ci_nachweis.py --sha "${SHA}" --tree "${TREE}"

  statisch:
    name: Statische Prüfungen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: PHP-Syntax
        run: |
          php --version | head -1
          find app deploy -name '*.php' ! -path 'app/api/geo/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript-Syntax
        run: for f in app/assets/*.js app/assets/vendor/*.js dashboard/*.js tests/unit/*.js; do node --check "$f"; done
      - name: Shell-Skripte (shellcheck)
        run: shellcheck --severity=warning deploy/*.sh deploy/*/*.sh tests/deploy/*.sh
      - name: Caddy-Konfiguration mit echtem Parser prüfen
        run: |
          docker run --rm --network none \
            -e DOMAIN=angebot-stafl.de \
            -e ALLOWED_IPS=0.0.0.0/0 \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - name: Dashboard-Domains nur als geschützte Platzhalter
        run: python3 tests/deploy/test_dashboard_domains.py
      - name: Python-Syntax
        run: python3 -m py_compile tests/run_e2e.py tests/e2e/*.py tests/regeln/*.py tests/unit/*.py werkzeuge/*.py deploy/*.py .github/scripts/*.py
      - name: Regelwerk und Modulgrenzen (werkzeuge/regeln.py)
        # Modulregister, Datenverantwortung, Rechte-Zuordnung, Geschäftsregeln, Wartungs-Entscheidungstabelle (regeln/*.toml)
        run: |
          python3 werkzeuge/regeln.py pruefen
          python3 tests/regeln/test_regeln.py
      - name: Entwickler-Dokumentation passt zum Code (werkzeuge/doku.py)
        # Referenz docs/entwickler/referenz/ aus Code und regeln/ erzeugt; jede Code-Datei mit beschreibendem Kopfkommentar
        run: python3 werkzeuge/doku.py pruefen
      - name: Versionsnummern der Skripte und Stylesheets
        run: python3 werkzeuge/asset_versionen.py
      - name: Prüfliste der Dateiprüfung (app/api/lib/integritaet-liste.php)
        run: python3 werkzeuge/integritaet.py
      - name: Tests ohne fest eingetragene Ports (parallele Testläufe)
        run: |
          if grep -rnE "127\.0\.0\.1:[0-9]{4}" tests/e2e --include=*.py | grep -v "tests/e2e/umgebung.py"; then
            echo "::error::Ports/Adressen in Tests bitte über tests/e2e/umgebung.py (BASE, SMTP_PORT, …) beziehen."; exit 1
          fi
      - name: Unit-Test Bestands-Parser
        run: node tests/unit/bestand_parser.test.js
      - name: Unit-Tests exakte Bestandswochen und Preisvergleich
        run: |
          php tests/unit/stock_prices.php
          node tests/unit/stock_prices.test.js
      - name: Unit-Test gemeinsames Bearbeiten (Abgleich)
        run: node tests/unit/merge.test.js
      - name: Unit-Tests CI-Werkzeuge (Aufteilung der Testgruppen, Nachweis nach dem Merge, Paketvorrat, Entwickler-Doku)
        run: |
          python3 tests/unit/test_run_e2e_teile.py
          python3 tests/unit/test_ci_nachweis.py
          python3 tests/unit/test_apt_vorrat.py
          python3 tests/unit/test_doku.py
      - name: Workflows prüfen (actionlint)
        run: |
          curl -sSLf -o /tmp/al.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/al.tgz" | sha256sum -c -
          tar xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint -color

  sicherheit:
    name: Sicherheitsprüfungen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret-Scan über den gesamten Verlauf (gitleaks)
        run: |
          curl -sSLf -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gl.tgz" | sha256sum -c -
          tar xzf /tmp/gl.tgz -C /tmp gitleaks
          # Verlauf des geprüften Stands (alle Commits bis HEAD, im PR inkl. seiner Commits) – nicht die Zweige anderer offener
          # PRs: ohne die Einschränkung durchsucht gitleaks alle geholten Zweige (--all), und ein offener Zweig ließ main scheitern
          /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="--full-history HEAD"
      - name: Trivy installieren
        run: |
          curl -sSLf -o /tmp/tv.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/tv.tgz" | sha256sum -c -
          tar xzf /tmp/tv.tgz -C /tmp trivy
      - name: Python-Testabhängigkeiten auf bekannte Lücken prüfen
        run: /tmp/trivy fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL tests/requirements.txt
      - name: Container-Images auf bekannte Lücken prüfen (Bericht)
        run: |
          grep -E '^\s*image:' docker-compose.yml | awk '{print $2}' | while read -r img; do
            echo "::group::$img"
            /tmp/trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$img"
            echo "::endgroup::"
          done

  image:
    # Anwendungs-Image mit mod_auth_openidc (deploy/image, Roadmap 7b-4) – noch nicht im Betrieb (docker-compose.yml
    # nutzt php:8.3-apache). Geprüft: Bau, gleiches Verhalten wie das Grundimage, Schwachstellen (kritisch blockiert).
    name: Anwendungs-Image prüfen
    needs: [nachweis, statisch]
    # Übersprungen nur auf main, wenn der Pull-Request-Lauf denselben Stand vollständig geprüft hat (Auftrag „nachweis“)
    if: ${{ !cancelled() && needs.statisch.result == 'success' && !(needs.nachweis.result == 'success' && needs.nachweis.outputs.uebernommen == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Image bauen und mit dem Grundimage vergleichen
        run: bash deploy/image/pruefen.sh
      - name: Betriebskonfiguration der zentralen Anmeldung prüfen (deploy/anmeldung, nicht aktiv)
        run: |
          docker pull -q quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244 >/dev/null
          docker pull -q postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 >/dev/null
          bash deploy/anmeldung/pruefen.sh
      - name: Trivy installieren
        run: |
          curl -sSLf -o /tmp/tv.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/tv.tgz" | sha256sum -c -
          tar xzf /tmp/tv.tgz -C /tmp trivy
      - name: Schwachstellen im Image (kritisch mit Korrektur blockiert, hoch als Bericht)
        run: |
          /tmp/trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 stafl-app:pruefung
          /tmp/trivy image --scanners vuln --severity HIGH --ignore-unfixed --exit-code 0 stafl-app:pruefung

  betrieb:
    name: Sicherung und Release-Prozess
    needs: [nachweis, statisch]
    if: ${{ !cancelled() && needs.statisch.result == 'success' && !(needs.nachweis.result == 'success' && needs.nachweis.outputs.uebernommen == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Datenbankmigration, Parallelzugriffe und Wiederherstellung
        run: python3 tests/deploy/test_datenbank.py
      - name: Datenbankschutz im PHP-Container
        run: sh tests/deploy/test_sqlite_http.sh
      - name: Datensicherung (deploy/sichern.sh)
        run: sh tests/deploy/test_sichern.sh
      - name: Release-Modus mit Healthcheck und Rückfall (deploy/freigabe-einspielen.sh)
        run: sh tests/deploy/test_freigabe.sh
      - name: Testumgebung verwalten (mit Platzhaltern für docker/git)
        run: sh tests/deploy/test_testumgebung.sh
      - name: Prüfungen des Release-Laufs (mit Platzhalter für gh)
        run: sh tests/deploy/test_release_pruefen.sh
      - name: Einrichtung der zentralen Anmeldung (Geheimnisse, Realm-Import)
        run: sh tests/deploy/test_anmeldung_einrichten.sh
      - name: Notzugang zum alten Eingabebereich (deploy/notzugang.sh, mit Platzhalter für docker compose)
        run: sh tests/deploy/test_notzugang.sh
      - name: Diagnose von Anmeldeproblemen (konten.sh pruefen, mit Platzhalter für Keycloak)
        run: sh tests/deploy/test_konten_pruefen.sh

  e2e:
    # Je Speicherart drei Teile mit möglichst gleicher Laufzeit (tests/run_e2e.py, teile()). Die Zahl der Teile steht
    # zweimal: Liste „teil“ und Nenner in WA_TEIL – tests/unit/test_run_e2e_teile.py prüft, dass beides zusammenpasst.
    strategy:
      fail-fast: false
      matrix:
        storage: [files, sqlite]
        teil: [1, 2, 3]
    name: Ende-zu-Ende-Tests (${{ matrix.storage }}, Teil ${{ matrix.teil }}/3)
    env:
      WA_TEST_STORAGE: ${{ matrix.storage }}
      WA_TEIL: ${{ matrix.teil }}/3
    needs: [nachweis, statisch]
    if: ${{ !cancelled() && needs.statisch.result == 'success' && !(needs.nachweis.result == 'success' && needs.nachweis.outputs.uebernommen == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Paketvorrat aus dem Zwischenspeicher (gefüllt von zwischenspeicher.yml)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/stafl-apt
          # Einträge heißen …-<hash>-<Woche>: neuester mit gleicher Paketliste, sonst neuester überhaupt
          key: apt-v1-${{ runner.os }}-${{ hashFiles('.github/scripts/testumgebung.sh', 'tests/requirements.txt') }}
          restore-keys: |
            apt-v1-${{ runner.os }}-${{ hashFiles('.github/scripts/testumgebung.sh', 'tests/requirements.txt') }}-
            apt-v1-${{ runner.os }}-
      - name: Testumgebung einrichten
        run: |
          php --version | head -1
          bash .github/scripts/testumgebung.sh e2e
      - name: Testgruppen dieses Teils gegen frische Testserver (4 Gruppen parallel)
        env:
          WA_JOBS: "4"
        run: python tests/run_e2e.py
      - name: Protokolle und Bildschirmfotos bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-ergebnisse-${{ matrix.storage }}-teil${{ matrix.teil }}
          path: |
            tests/.ergebnisse/
            tests/.arbeit/*.log
          retention-days: 7

  e2e_required:
    # Stable required-check name: preserve existing branch protection with the new matrix.
    # Verlangt alle Teile beider Speicherarten. Übersprungen nur, wenn der Nachweis die Prüfung übernommen hat (main).
    name: Ende-zu-Ende-Tests
    needs: [nachweis, e2e]
    if: ${{ always() && !(needs.nachweis.result == 'success' && needs.nachweis.outputs.uebernommen == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Alle Teile beider Speicherarten erfolgreich
        env:
          RESULT: ${{ needs.e2e.result }}
        run: test "$RESULT" = success

  oidc:
    # Anmeldung über Keycloak (Roadmap 7b, ADR-003): Keycloak + PostgreSQL + Caddy + Apache/mod_auth_openidc nur hier in
    # der CI (GR-111) – nichts davon läuft auf dem Server. Versionen und Prüfsummen in tests/oidc/umgebung.sh.
    name: Anmeldung über Keycloak (nur CI)
    needs: [nachweis, statisch]
    if: ${{ !cancelled() && needs.statisch.result == 'success' && !(needs.nachweis.result == 'success' && needs.nachweis.outputs.uebernommen == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Paketvorrat aus dem Zwischenspeicher (gefüllt von zwischenspeicher.yml)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/stafl-apt
          # Einträge heißen …-<hash>-<Woche>: neuester mit gleicher Paketliste, sonst neuester überhaupt
          key: apt-v1-${{ runner.os }}-${{ hashFiles('.github/scripts/testumgebung.sh', 'tests/requirements.txt') }}
          restore-keys: |
            apt-v1-${{ runner.os }}-${{ hashFiles('.github/scripts/testumgebung.sh', 'tests/requirements.txt') }}-
            apt-v1-${{ runner.os }}-
      - name: Keycloak und Caddy aus dem Zwischenspeicher (Prüfsummen prüft umgebung.sh bei jedem Start)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: tests/.arbeit/downloads
          key: oidc-downloads-v1-${{ hashFiles('tests/oidc/umgebung.sh') }}
          restore-keys: oidc-downloads-v1-
      - name: Testumgebung einrichten
        run: bash .github/scripts/testumgebung.sh oidc
      - name: Keycloak, Caddy und Apache starten
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          bash tests/oidc/umgebung.sh start
      - name: Anmeldung über Keycloak prüfen
        run: python tests/oidc/test_oidc.py
      - name: Umgebung beenden
        if: always()
        run: bash tests/oidc/umgebung.sh stop
      - name: Protokolle bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oidc-ergebnisse
          path: |
            tests/.ergebnisse/oidc_*
            tests/.arbeit/oidc/*.log
            tests/.arbeit/oidc/apache/*.log
          retention-days: 7

  vollstaendig:
    # Läuft nur, wenn alle Aufträge erfolgreich waren. Der Name hält den geprüften Stand fest: Daran erkennt der Lauf
    # nach dem Merge (Auftrag „nachweis“), dass genau dieser Inhalt schon vollständig geprüft ist. Auch release-pruefen.sh
    # verlangt diesen Auftrag (oder „Prüfung aus Pull Request übernommen“) im CI-Lauf des Release-Commits.
    name: Vollständig geprüft (Stand ${{ needs.nachweis.outputs.tree }})
    needs: [nachweis, statisch, sicherheit, image, betrieb, e2e_required, oidc]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Geprüften Stand festhalten
        env:
          TREE: ${{ needs.nachweis.outputs.tree }}
        run: |
          [ "${#TREE}" = 40 ] || { echo "::error::Kein geprüfter Stand vom Auftrag nachweis."; exit 1; }
          echo "### Vollständig geprüft: Tree \`${TREE}\` (Commit \`${GITHUB_SHA:0:7}\`)" >> "${GITHUB_STEP_SUMMARY}"

  uebernommen:
    # Nur auf main: Der Pull-Request-Lauf hat genau diesen Stand vollständig geprüft – schwere Aufträge übersprungen.
    name: Prüfung aus Pull Request übernommen
    needs: [nachweis, statisch, sicherheit]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.nachweis.result == 'success' && needs.nachweis.outputs.uebernommen == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Nachweis festhalten
        env:
          LAUF: ${{ needs.nachweis.outputs.lauf }}
          TREE: ${{ needs.nachweis.outputs.tree }}
        run: |
          echo "### Prüfung übernommen: Tree \`${TREE}\` wurde bereits vollständig geprüft" >> "${GITHUB_STEP_SUMMARY}"
          echo "Pull-Request-Lauf: ${LAUF}" >> "${GITHUB_STEP_SUMMARY}"

  release_vorlegen:
    # Nach erfolgreicher CI auf main: Release-Lauf starten. Er wartet auf die Freigabe in der Umgebung
    # „produktion“ (release.yml); ohne Freigabe geht nichts live. Vorgelegt wird nur mit Nachweis: entweder alle
    # Aufträge in diesem Lauf erfolgreich („vollstaendig“) oder Prüfung aus dem Pull Request übernommen („uebernommen“).
    name: Release zur Freigabe vorlegen
    needs: [vollstaendig, uebernommen]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.vollstaendig.result == 'success' || needs.uebernommen.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write   # Release-Lauf starten
    steps:
      - name: Release-Lauf starten (wartet auf Freigabe)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          NACHRICHT: ${{ github.event.head_commit.message }}
        run: |
          zeile1=$(printf '%s\n' "${NACHRICHT}" | sed -n 1p)
          titel=$(printf '%s\n' "${NACHRICHT}" | sed -n '3,$p' | sed '/^$/d' | head -1)
          case "${zeile1}" in
            "Merge pull request #"*) nr=$(printf '%s' "${zeile1}" | sed -E 's/^Merge pull request (#[0-9]+).*/\1/'); grund="PR ${nr}: ${titel:-${zeile1}}" ;;
            *) grund="${zeile1}" ;;
          esac
          grund=$(printf '%.200s' "${grund}")
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref main -f grund="${grund}" -f sha="${SHA}"
          {
            echo "### Release zur Freigabe vorgelegt: \`${SHA:0:7}\`"
            echo "Grund: ${grund}"
            echo "Freigeben: Actions → Release → wartender Lauf → Review deployments → Approve and deploy."
          } >> "${GITHUB_STEP_SUMMARY}"
