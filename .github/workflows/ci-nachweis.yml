# Trockenlauf des Nachweises „schon im Pull Request vollständig geprüft“ (ci.yml, Auftrag „nachweis“):
# zeigt für einen Commit auf main, ob die CI dort die schweren Aufträge überspringen würde und warum (nicht).
# Ändert nichts, startet keinen Release und zählt nicht als CI-Lauf (release-pruefen.sh liest nur ci.yml).
# Starten: Actions → „CI-Nachweis (Trockenlauf)“ → Run workflow (Branch main, optional Commit eintragen).
name: CI-Nachweis (Trockenlauf)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit auf main (leer = aktueller Stand)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read         # CI-Läufe und Aufträge lesen
  pull-requests: read   # Pull Request zum Commit

jobs:
  pruefen:
    name: Nachweis prüfen (Trockenlauf, ändert nichts)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Nachweis suchen
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
        run: python3 -I .github/scripts/ci_nachweis.py --sha "${SHA}" --trockenlauf
