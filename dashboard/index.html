<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>STAFL-Plattform · Dashboard</title>
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<script src="../assets/theme.js"></script>
<script src="../assets/format.js"></script>
<link rel="stylesheet" href="../assets/app.css">
<link rel="stylesheet" href="../assets/rahmen.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body class="db r">
<div class="r-app">
  <nav class="r-leiste" id="r-leiste" aria-label="Hauptnavigation" hidden></nav>
  <div class="r-inhalt">
    <main class="db-main r-seite">
      <section class="db-login" id="db-login" hidden>
        <img class="r-logo" src="../assets/logo-standard-fleisch-kopf.png" width="428" height="96" alt="Standard-Fleisch">
        <svg class="r-i db-login-i" aria-hidden="true"><use href="#i-lock"/></svg>
        <h1>Bitte anmelden</h1>
        <p>Das Dashboard zeigt Ihre Anwendungen nach der Anmeldung als Mitarbeiter.</p>
        <a class="btn primary" href="../admin/">Zur Anmeldung</a>
      </section>
      <p class="db-err" id="db-err" role="alert" hidden></p>
      <section id="db-bereich" hidden>
        <header class="r-seitenkopf">
          <div>
            <h1 id="db-titel">Willkommen</h1>
            <p class="r-unterzeile"><span id="db-datum"></span><span aria-hidden="true"> · </span><span id="db-sub"></span></p>
            <p class="db-darstellung-hinweis" id="db-darstellung-hinweis" role="status" hidden></p>
          </div>
          <div class="r-aktionen">
            <button class="r-rund" id="db-darstellung" type="button" aria-pressed="false" aria-label="Einfache Darstellung einschalten (für Remote-Desktop)" title="Einfache Darstellung für Remote-Desktop"><svg class="r-i" aria-hidden="true"><use href="#i-schnell"/></svg></button>
            <button class="r-rund" id="db-theme" type="button" aria-label="Dunkles Design einschalten" title="Hell / Dunkel"><svg class="r-i" aria-hidden="true"><use href="#i-moon"/></svg></button>
          </div>
        </header>
        <p class="db-notfall" id="db-notfall" role="status" hidden></p>
        <section class="r-abschnitt" aria-labelledby="db-apps-titel">
          <h2 id="db-apps-titel">Anwendungen</h2>
          <div class="db-grid" id="db-grid" role="list" aria-labelledby="db-apps-titel"></div>
        </section>
        <section class="r-abschnitt db-gruppe" id="db-verwaltung" aria-labelledby="db-verwaltung-titel" hidden>
          <h2 id="db-verwaltung-titel">Verwaltung &amp; Daten</h2>
          <div class="db-grid" id="db-grid-verwaltung" role="list" aria-labelledby="db-verwaltung-titel"></div>
        </section>
      </section>
    </main>
    <footer class="db-fuss">STAFL-Plattform · Standard-Fleisch</footer>
  </div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-schnell" viewBox="0 0 24 24"><path d="M13 2.5 5 13.5h6l-1 8 8-11h-6z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
</svg>
<script src="../assets/rahmen.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
