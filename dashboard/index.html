<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>STAFL-Plattform · Dashboard</title>
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<script src="../assets/theme.js"></script>
<link rel="stylesheet" href="../assets/app.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body class="db">
<header class="db-top">
  <div class="db-top-inner">
    <div class="brand"><img class="brand-logo" src="../assets/logo-standard-fleisch-kopf.png" width="428" height="96" alt="Standard-Fleisch"><div><div class="brand-company">Standard-Fleisch</div><h1>STAFL-Plattform</h1></div></div>
    <div class="db-actions">
      <span class="db-user" id="db-user" hidden></span>
      <button class="btn icon ghost" id="db-theme" type="button" aria-label="Dunkles Design einschalten" title="Hell / Dunkel"><svg class="i" aria-hidden="true"><use href="#i-moon"/></svg></button>
      <button class="btn" id="db-logout" type="button" hidden><svg class="i" aria-hidden="true"><use href="#i-logout"/></svg><span>Abmelden</span></button>
    </div>
  </div>
</header>
<main class="db-main">
  <section class="db-login" id="db-login" hidden>
    <svg class="i db-login-i" aria-hidden="true"><use href="#i-lock"/></svg>
    <h2>Bitte anmelden</h2>
    <p>Das Dashboard zeigt Ihre Anwendungen nach der Anmeldung als Mitarbeiter.</p>
    <a class="btn primary" href="../admin/">Zur Anmeldung</a>
  </section>
  <p class="db-err" id="db-err" role="alert" hidden></p>
  <section id="db-bereich" hidden>
    <div class="db-head"><h2>Anwendungen</h2><p class="db-sub" id="db-sub"></p></div>
    <div class="db-grid" id="db-grid" role="list"></div>
  </section>
</main>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1 1 0 0 1 0 1.4l-7.3 7.3a1 1 0 0 1-1.4 0z"/><circle cx="8" cy="8" r="1.3"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 19.5a6.5 6.5 0 0 1 13 0M16 5.2a3.5 3.5 0 0 1 0 6.6M18 14.2a6.5 6.5 0 0 1 3.5 5.3"/></symbol>
  <symbol id="i-store" viewBox="0 0 24 24"><path d="M4 9.5 5.5 4.5h13L20 9.5M4 9.5v10h16v-10M4 9.5c0 1.4 1.1 2.5 2.7 2.5S9.3 10.9 9.3 9.5c0 1.4 1.2 2.5 2.7 2.5s2.7-1.1 2.7-2.5c0 1.4 1.1 2.5 2.6 2.5S20 10.9 20 9.5M10 19.5V15h4v4.5"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 5 6.5v5c0 4.3 3 7.9 7 9 4-1.1 7-4.7 7-9v-5z"/><path d="m9 12 2.2 2.2L15.5 10"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3.5 4.5h2.2l2 10.5h10.3l1.8-7.5H6.6"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7 8.5 12 4l5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H14M10 12h10M16.5 8.5 20 12l-3.5 3.5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.1"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
</svg>
<script src="dashboard.js"></script>
</body>
</html>
