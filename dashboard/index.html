<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>STAFL-Plattform · Dashboard</title>
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<script src="../assets/theme.js"></script>
<link rel="stylesheet" href="../assets/app.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body class="db">
<div class="db-bg" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="db-seite">
  <header class="db-kopf db-glas">
    <div class="db-marke"><img class="brand-logo" src="../assets/logo-standard-fleisch-kopf.png" width="428" height="96" alt="Standard-Fleisch"></div>
    <div class="db-actions">
      <button class="db-rund" id="db-theme" type="button" aria-label="Dunkles Design einschalten" title="Hell / Dunkel"><svg class="i" aria-hidden="true"><use href="#i-moon"/></svg></button>
      <span class="db-user" id="db-user" hidden><span class="db-initialen" id="db-initialen" aria-hidden="true"></span><span class="sr-only">Angemeldet als </span><span class="db-user-name" id="db-user-name"></span></span>
      <button class="db-abmelden" id="db-logout" type="button" hidden><svg class="i" aria-hidden="true"><use href="#i-logout"/></svg><span>Abmelden</span></button>
    </div>
  </header>
  <main class="db-main">
    <section class="db-login db-glas" id="db-login" hidden>
      <svg class="i db-login-i" aria-hidden="true"><use href="#i-lock"/></svg>
      <h1>Bitte anmelden</h1>
      <p>Das Dashboard zeigt Ihre Anwendungen nach der Anmeldung als Mitarbeiter.</p>
      <a class="btn primary" href="../admin/">Zur Anmeldung</a>
    </section>
    <p class="db-err" id="db-err" role="alert" hidden></p>
    <section id="db-bereich" hidden>
      <div class="db-gruss">
        <p class="db-datum" id="db-datum"></p>
        <h1 id="db-titel">Willkommen</h1>
        <p class="db-sub" id="db-sub"></p>
      </div>
      <div class="db-grid" id="db-grid" role="list" aria-label="Anwendungen"></div>
      <section class="db-gruppe" id="db-verwaltung" aria-labelledby="db-verwaltung-titel" hidden>
        <div class="db-gruppe-kopf"><h2 id="db-verwaltung-titel">Verwaltung &amp; Daten</h2></div>
        <div class="db-grid db-grid-breit" id="db-grid-verwaltung" role="list" aria-label="Verwaltung und Daten"></div>
      </section>
    </section>
  </main>
  <footer class="db-fuss">STAFL-Plattform · Standard-Fleisch</footer>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-box" viewBox="0 0 24 24"><rect x="7.5" y="3" width="9" height="8" rx="1.6"/><rect x="2.5" y="13" width="9" height="8" rx="1.6"/><rect x="12.5" y="13" width="9" height="8" rx="1.6"/><path d="M10.5 6.5h3M5.5 16.5h3M15.5 16.5h3"/></symbol>

  <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9.5" cy="19.6" r="1.5" fill="currentColor" stroke="none"/><circle cx="17.5" cy="19.6" r="1.5" fill="currentColor" stroke="none"/><path d="M2.5 3.5h2.8l2.4 11.2a1.8 1.8 0 0 0 1.8 1.4h7.9a1.8 1.8 0 0 0 1.7-1.3L21 8H6.2"/></symbol>

  <symbol id="i-container" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="1.6"/><path d="M6.5 9v6M10 9v6M14 9v6M17.5 9v6"/><path d="M2.5 21h19"/></symbol>

  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H14M10 12h10M16.5 8.5 20 12l-3.5 3.5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="14" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="14" r="1.1" fill="currentColor" stroke="none"/><circle cx="8.5" cy="17.3" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="17.3" r="1.1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-megaphone" viewBox="0 0 24 24"><path d="M3.5 10v4h3.2l6.8 4.4V5.6L6.7 10z" fill="currentColor"/><path d="M6.7 14l1.2 5.5h2.4M16.6 9a4.4 4.4 0 0 1 0 6M19.4 6.4a8.2 8.2 0 0 1 0 11.2"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20.5v-4M10 20.5v-7M15 20.5v-5M20 20.5V10M4 11.5 9.5 7l4 3L19.5 4M15.5 4h4v4"/></symbol>
  <symbol id="i-pfeil" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>

<script src="dashboard.js"></script>
</body>
</html>
