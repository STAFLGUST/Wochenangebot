<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>STAFL-Plattform · Dashboard</title>
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<script src="../assets/theme.js"></script>
<link rel="stylesheet" href="../assets/app.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body class="db">
<div class="db-bg" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="db-seite">
  <header class="db-kopf db-glas">
    <div class="db-marke"><img class="brand-logo" src="../assets/logo-standard-fleisch-kopf.png" width="428" height="96" alt="Standard-Fleisch"></div>
    <div class="db-actions">
      <button class="db-rund" id="db-theme" type="button" aria-label="Dunkles Design einschalten" title="Hell / Dunkel"><svg class="i" aria-hidden="true"><use href="#i-moon"/></svg></button>
      <span class="db-user" id="db-user" hidden><span class="db-initialen" id="db-initialen" aria-hidden="true"></span><span class="sr-only">Angemeldet als </span><span class="db-user-name" id="db-user-name"></span></span>
      <button class="db-abmelden" id="db-logout" type="button" hidden><svg class="i" aria-hidden="true"><use href="#i-logout"/></svg><span>Abmelden</span></button>
    </div>
  </header>
  <main class="db-main">
    <section class="db-login db-glas" id="db-login" hidden>
      <svg class="i db-login-i" aria-hidden="true"><use href="#i-lock"/></svg>
      <h1>Bitte anmelden</h1>
      <p>Das Dashboard zeigt Ihre Anwendungen nach der Anmeldung als Mitarbeiter.</p>
      <a class="btn primary" href="../admin/">Zur Anmeldung</a>
    </section>
    <p class="db-err" id="db-err" role="alert" hidden></p>
    <section id="db-bereich" hidden>
      <div class="db-gruss">
        <p class="db-datum" id="db-datum"></p>
        <h1 id="db-titel">Willkommen</h1>
        <p class="db-sub" id="db-sub"></p>
      </div>
      <div class="db-grid" id="db-grid" role="list" aria-label="Anwendungen"></div>
    </section>
  </main>
  <footer class="db-fuss">STAFL-Plattform · Standard-Fleisch</footer>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></symbol>
  <symbol id="i-store" viewBox="0 0 24 24"><path d="M3 9h18l-1.5-5h-15z"/><path d="M4 9v11h16V9M10 20v-6h4v6"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.6 3.4 8.3 8 9 4.6-.7 8-4.4 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L22 8H6"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
  <symbol id="i-haus" viewBox="0 0 24 24"><path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-6h6v6M4 13h16"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H14M10 12h10M16.5 8.5 20 12l-3.5 3.5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h2M14 14h2M8 17.5h2"/></symbol>
  <symbol id="i-megaphone" viewBox="0 0 24 24"><path d="M4 10v4a1 1 0 0 0 1 1h2l5 4V5L7 9H5a1 1 0 0 0-1 1z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.8 6a8.5 8.5 0 0 1 0 12"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
</svg>
<script src="dashboard.js"></script>
</body>
</html>
